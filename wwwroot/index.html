'use strict';

// -------------------------------------------------------------
// CONFIGURACIÓN Y CLIENTE API
// -------------------------------------------------------------
const API_BASE = window.API_BASE_URL || ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') ? 'http://localhost:5254' : '');

async function api(endpoint, options = {}) {
  const token = sessionStorage.getItem('utm_token') || localStorage.getItem('utm_token');
  const headers = { ...options.headers };

  if (token) {
    headers['Authorization'] = 'Bearer ' + token;
  }

  if (options.body && !(options.body instanceof FormData) && !headers['Content-Type']) {
    headers['Content-Type'] = 'application/json';
  }

  const url = endpoint.startsWith('http') ? endpoint : API_BASE + endpoint;
  
  try {
    const res = await fetch(url, { ...options, headers });

    if (res.status === 401) {
      if (user) {
        logout('Tu sesión ha expirado. Inicia sesión nuevamente.');
      }
      throw new Error('Credenciales inválidas o sesión no autorizada.');
    }

    if (!res.ok) {
      let errorMsg = 'Error en el servidor (' + res.status + ')';
      try {
        const errorData = await res.json();
        errorMsg = errorData.detail || errorData.title || errorData.message || (errorData.errors ? Object.values(errorData.errors).flat().join(', ') : errorMsg);
      } catch {
        const text = await res.text();
        if (text) errorMsg = text;
      }
      throw new Error(errorMsg);
    }

    if (res.status === 204) return null;
    return await res.json();
  } catch (err) {
    if (err.name === 'TypeError' && err.message.includes('fetch')) {
      throw new Error('No se pudo conectar con la API en ' + (API_BASE || window.location.origin) + '. Verifica que el backend esté ejecutándose.');
    }
    throw err;
  }
}

async function apiUpload(endpoint, formData) {
  const token = sessionStorage.getItem('utm_token') || localStorage.getItem('utm_token');
  const headers = {};
  if (token) {
    headers['Authorization'] = 'Bearer ' + token;
  }
  const url = endpoint.startsWith('http') ? endpoint : API_BASE + endpoint;
  const res = await fetch(url, {
    method: 'POST',
    headers,
    body: formData
  });

  if (!res.ok) {
    let errorMsg = 'Error al subir evidencia (' + res.status + ')';
    try {
      const errJson = await res.json();
      errorMsg = errJson.detail || errJson.title || errorMsg;
    } catch {}
    throw new Error(errorMsg);
  }
  return await res.json();
}

// -------------------------------------------------------------
// CONSTANTES Y DICCIONARIOS
// -------------------------------------------------------------
const CATS = {
  computo_redes: 'Cómputo y redes',
  infraestructura: 'Infraestructura',
  academico: 'Servicios académicos'
};

const STATUS = {
  abierta: 'Abierta',
  'en proceso': 'En proceso',
  'en espera': 'En espera',
  resuelta: 'Resuelta',
  cerrada: 'Cerrada'
};

const STATUSES = ['abierta', 'en proceso', 'en espera', 'resuelta', 'cerrada'];
const WORK_STATUSES = ['en proceso', 'en espera', 'resuelta'];

const ROLES_LABELS = {
  reportante: 'Reportante',
  tecnico: 'Técnico',
  coordinador: 'Coordinador',
  directivo: 'Directivo',
  superAdmin: 'Super Administrador'
};

const SPEC = {
  computo_redes: [
    ['tipo_equipo', 'Tipo de equipo', true],
    ['tipo_falla', 'Tipo de falla', true],
    ['direccion_ip', 'Dirección IP', false],
    ['vlan', 'VLAN', false]
  ],
  infraestructura: [
    ['tipo_dano', 'Tipo de daño', true],
    ['riesgo_seguridad', 'Riesgo de seguridad', true, ['bajo', 'medio', 'alto']],
    ['requiere_insumos', '¿Requiere insumos?', true, [['si', 'Sí'], ['no', 'No']]],
    ['insumos_requeridos', 'Insumos requeridos', false],
    ['requiere_contratista', '¿Requiere contratista?', true, [['si', 'Sí'], ['no', 'No']]]
  ],
  academico: [
    ['plataforma', 'Plataforma', true],
    ['codigo_curso', 'Código del curso', true],
    ['periodo_escolar', 'Periodo escolar', true],
    ['estudiantes_afectados', 'Estudiantes afectados', true],
    ['codigo_error', 'Código de error', false]
  ]
};

// -------------------------------------------------------------
// ESTADO DE LA APLICACIÓN
// -------------------------------------------------------------
let user = null;
let screen = 'home';
let selected = null;
let selectedTicket = null;
let ticketEvidence = [];
let tickets = [];
let query = '';
let filterTags = [];
let filterEstado = '';
let filterCategoria = '';
let page = 1;
const pageSize = 10;
let totalTickets = 0;

let draft = null;
let workDraft = null;
let assignDraft = null;
let closeDraft = null;
let reopenDraft = null;
let userFormDraft = null;
let ticketEditDraft = null;
let managedUserId = null;

let errors = {};
let files = [];
let completion = null;
let notice = '';
let busy = false;
let techniciansCache = [];
let usersCache = [];
let analyticsCache = null;

const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normalize = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const cleanTag = s => normalize(s).replace(/^#+/, '').trim().replace(/\s+/g, '_').replace(/[^a-z0-9_-]/g, '').slice(0, 32);

// -------------------------------------------------------------
// HELPERS DE ROL Y ALCANCE
// -------------------------------------------------------------
const is = r => !!user && user.rol === r;

const brand = () => '<div class="brand"><i class="mark" aria-hidden="true"></i>UTM<span>desk</span></div>';

const roleLabel = () => ROLES_LABELS[user?.rol] || user?.rol || 'Usuario';

const scope = () => {
  if (!user) return '';
  switch (user.rol) {
    case 'reportante': return 'Únicamente tus reportes';
    case 'tecnico': return 'Incidencias asignadas a ti';
    case 'coordinador': return 'Administración · ' + (CATS[user.area] || user.area || 'Infraestructura');
    case 'directivo': return 'Todo el campus · Solo lectura';
    case 'superAdmin': return 'Control global del sistema';
    default: return '';
  }
};

function canCreate() {
  return !!user && (user.rol === 'reportante' || user.rol === 'superAdmin');
}

function canWork(t) {
  if (!user || !t) return false;
  if (user.rol === 'superAdmin') return true;
  if (user.rol === 'tecnico' && t.tecnicoAsignado?.usuarioId === user.id) return true;
  if (user.rol === 'coordinador' && t.categoria === user.area) return true;
  return false;
}

function canAssign(t) {
  if (!user || !t) return false;
  if (user.rol === 'superAdmin') return true;
  if (user.rol === 'coordinador' && t.categoria === user.area) return true;
  return false;
}

function canClose(t) {
  if (!user || !t) return false;
  if (t.estado === 'cerrada') return false;
  return user.rol === 'coordinador' || user.rol === 'superAdmin';
}

function canReopen(t) {
  if (!user || !t) return false;
  if (t.estado !== 'cerrada' && t.estado !== 'resuelta') return false;
  if (user.rol === 'superAdmin' || user.rol === 'coordinador') return true;
  if (user.rol === 'reportante' && t.reportante?.usuarioId === user.id) return true;
  return false;
}

function canAttach(t) {
  return !!user && user.rol !== 'directivo';
}

// -------------------------------------------------------------
// COMPONENTES DE UI
// -------------------------------------------------------------
function badge(s) {
  const norm = (s || '').toLowerCase();
  const isAttention = norm === 'en proceso' || norm === 'en espera' || norm === 'en_atencion';
  const isResolved = norm === 'resuelta' || norm === 'cerrada';
  return '<span class="badge ' + (isAttention ? 'attention' : isResolved ? 'resolved' : '') + '">' + esc(STATUS[norm] || s) + '</span>';
}

function tag(t, click = false, active = false) {
  return click
    ? '<button type="button" class="tag ' + (active ? 'active' : '') + '" data-action="filter-tag" data-tag="' + esc(t) + '">#' + esc(t) + '</button>'
    : '<span class="tag">#' + esc(t) + '</span>';
}

function field(id, label, value = '', opts = {}) {
  const error = errors[id];
  const optional = opts.optional ? ' <span class="opt">Opcional</span>' : ' *';
  let control = '';

  if (opts.options) {
    control = '<select id="' + id + '" name="' + id + '" ' + (error ? 'aria-invalid="true" class="invalid"' : '') + '>' +
      '<option value="">' + esc(opts.placeholder || 'Selecciona una opción') + '</option>' +
      opts.options.map(o => {
        const [v, l] = Array.isArray(o) ? o : [o, o];
        return '<option value="' + esc(v) + '" ' + (String(value) === String(v) ? 'selected' : '') + '>' + esc(l) + '</option>';
      }).join('') +
      '</select>';
  } else if (opts.textarea) {
    control = '<textarea id="' + id + '" name="' + id + '" maxlength="' + (opts.maxlength || 2000) + '" placeholder="' + esc(opts.placeholder || 'Escribe la información') + '" ' + (error ? 'aria-invalid="true" class="invalid"' : '') + '>' + esc(value) + '</textarea>';
  } else {
    control = '<input id="' + id + '" name="' + id + '" type="' + (opts.type || 'text') + '" ' +
      (opts.type === 'number' ? 'min="0" step="' + (opts.step || '1') + '"' : '') +
      ' maxlength="' + (opts.maxlength || 160) + '" autocomplete="' + (opts.autocomplete || 'off') + '" value="' + esc(value) + '" placeholder="' + esc(opts.placeholder || 'Escribe la información') + '" ' + (error ? 'aria-invalid="true" class="invalid"' : '') + '>';
  }

  return '<div class="field ' + (opts.full ? 'full' : '') + '">' +
    '<label for="' + id + '">' + label + optional + '</label>' +
    control +
    (opts.help ? '<p class="help">' + esc(opts.help) + '</p>' : '') +
    (error ? '<p class="field-error" id="err-' + id + '">' + esc(error) + '</p>' : '') +
    '</div>';
}

function errorBox() {
  const all = Object.values(errors);
  return all.length
    ? '<div class="errorbox" role="alert" tabindex="-1" id="validation-summary"><strong>Revisa ' + (all.length === 1 ? 'este campo' : 'estos campos') + ' antes de continuar</strong><ul>' + all.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>'
    : '';
}

function focusError() {
  const id = Object.keys(errors)[0];
  const el = $(id) || $('validation-summary');
  el?.focus();
  el?.scrollIntoView?.({ block: 'center', behavior: 'smooth' });
}

function btn(label, action, cls = '', extra = '') {
  return '<button type="button" class="' + cls + '" data-action="' + action + '" ' + extra + ' ' + (busy ? 'disabled' : '') + '>' + label + '</button>';
}

function ticketCard(t) {
  const id = t.id || t._id;
  const area = t.ubicacion ? t.ubicacion.edificio + ' / ' + t.ubicacion.area : '';
  const tech = t.tecnicoAsignado ? t.tecnicoAsignado.nombre : 'Sin asignar';
  const tagsList = t.tags || [];

  return '<article class="card ticket">' +
    '<div class="row between">' +
      '<div>' +
        '<h3>' + esc(t.titulo) + '</h3>' +
        '<div class="ticket-meta">' + esc(t.codigo) + ' · ' + esc(CATS[t.categoria] || t.categoria) + ' · ' + esc(area) + ' · Resp: ' + esc(tech) + '</div>' +
      '</div>' +
      '<div class="row">' +
        badge(t.estado) +
        '<button class="ghost" data-action="detail" data-id="' + esc(id) + '">Ver expediente →</button>' +
      '</div>' +
    '</div>' +
    '<div class="tags" style="margin-top:12px">' +
      tagsList.map(item => tag(item)).join('') +
    '</div>' +
  '</article>';
}

function metricCards(data) {
  const openCount = data.filter(t => t.estado === 'abierta').length;
  const inProgressCount = data.filter(t => t.estado === 'en proceso' || t.estado === 'en espera').length;
  const resolvedCount = data.filter(t => t.estado === 'resuelta' || t.estado === 'cerrada').length;

  return '<div class="metrics">' +
    '<div class="card metric"><div class="eyebrow">Pendientes</div><div class="number">' + openCount + '</div><span class="help">Estado abierta</span></div>' +
    '<div class="card metric"><div class="eyebrow">En atención</div><div class="number">' + inProgressCount + '</div><span class="help">En proceso o espera</span></div>' +
    '<div class="card metric"><div class="eyebrow">Resueltas</div><div class="number green">' + resolvedCount + '</div><span class="help">Resueltas o cerradas</span></div>' +
  '</div>';
}

async function list() {
  screen = 'list';
  errors = {};
  busy = true;

  let queryUrl = '/api/incidencias?pagina=' + page + '&tamanoPagina=' + pageSize;
  if (query.trim()) queryUrl += '&texto=' + encodeURIComponent(query.trim());
  if (filterTags.length > 0) queryUrl += '&tag=' + encodeURIComponent(filterTags[0]);
  if (filterEstado) queryUrl += '&estado=' + encodeURIComponent(filterEstado);
  if (filterCategoria) queryUrl += '&categoria=' + encodeURIComponent(filterCategoria);

  try {
    const res = await api(queryUrl);
    tickets = res.elementos || [];
    totalTickets = res.total || 0;
  } catch (err) {
    notice = 'Error al cargar incidencias: ' + err.message;
    tickets = [];
  } finally {
    busy = false;
  }

  // Extraer tags únicos para filtrar
  const tagsSet = new Set();
  tickets.forEach(t => (t.tags || []).forEach(x => tagsSet.add(x)));
  const tags = [...tagsSet];

  const totalPages = Math.max(1, Math.ceil(totalTickets / pageSize));

  const filterForm = '<section class="card" style="margin-bottom:22px">' +
    '<form id="searchform" class="filters">' +
      '<input id="query" name="query" aria-label="Buscar incidencias" type="search" placeholder="Buscar por palabras clave en título o descripción…" value="' + esc(query) + '">' +
      '<select id="filterEstado" style="max-width:160px">' +
        '<option value="">Todos los estados</option>' +
        STATUSES.map(s => '<option value="' + esc(s) + '" ' + (filterEstado === s ? 'selected' : '') + '>' + esc(STATUS[s]) + '</option>').join('') +
      '</select>' +
      '<select id="filterCategoria" style="max-width:180px">' +
        '<option value="">Todas las categorías</option>' +
        Object.entries(CATS).map(([k, v]) => '<option value="' + esc(k) + '" ' + (filterCategoria === k ? 'selected' : '') + '>' + esc(v) + '</option>').join('') +
      '</select>' +
      '<button type="submit">Buscar</button>' +
      btn('Limpiar', 'clear-filters', 'ghost') +
    '</form>' +
    (tags.length ? '<div class="tags" style="margin-top:12px">' + tags.map(t => tag(t, true, filterTags.includes(t))).join('') + '</div>' : '') +
    '<p class="help" style="margin-top:10px">Se filtran registros dentro de tu alcance autorizado en MongoDB Atlas.</p>' +
  '</section>';

  const paginationControls = totalPages > 1 ? '<div class="row between" style="margin-top:20px;padding:12px 0">' +
    '<span class="small muted">Página ' + page + ' de ' + totalPages + ' (' + totalTickets + ' resultados)</span>' +
    '<div class="row">' +
      (page > 1 ? btn('← Anterior', 'prev-page', 'ghost') : '') +
      (page < totalPages ? btn('Siguiente →', 'next-page', 'ghost') : '') +
    '</div>' +
  '</div>' : '';

  const listContent = filterForm +
    '<p class="small muted" style="margin-bottom:14px">' + totalTickets + ' resultados encontrados · ' + esc(scope()) + '</p>' +
    '<div class="stack">' +
      (tickets.length ? tickets.map(ticketCard).join('') : '<div class="card empty"><h2>No hay incidencias que coincidan</h2><p>Prueba con otros términos de búsqueda o elimina los filtros.</p></div>') +
    '</div>' +
    paginationControls;

  shell(
    is('tecnico') ? 'Mis asignaciones' : 'Listado de Incidencias',
    'Busca y consulta el expediente completo de cada reporte.',
    listContent,
    canCreate() ? btn('+ Crear incidencia', 'create') : ''
  );
}

function newDraft() {
  return {
    categoria: is('coordinador') ? user.area : '',
    titulo: '',
    descripcion: '',
    edificio: '',
    area: '',
    prioridad: 'media',
    tags: [],
    detalle: {}
  };
}

function beginCreate() {
  if (!canCreate()) return denied();
  draft = newDraft();
  files = [];
  errors = {};
  notice = '';
  create();
}

function readCreate(form) {
  const d = new FormData(form);
  for (const k of ['categoria', 'titulo', 'descripcion', 'edificio', 'area', 'prioridad']) {
    draft[k] = String(d.get(k) || '');
  }
  for (const [key] of SPEC[draft.categoria] || []) {
    draft.detalle[key] = String(d.get(key) || '');
  }
}

function tagEditor(tagsList) {
  return '<div class="tags">' +
    tagsList.map(t => '<span class="tag">#' + esc(t) + '<button type="button" aria-label="Quitar ' + esc(t) + '" data-action="remove-tag" data-tag="' + esc(t) + '">×</button></span>').join('') +
  '</div>' +
  '<div class="row" style="margin-top:12px">' +
    '<input id="taginput" aria-label="Nueva etiqueta" placeholder="Escribe una etiqueta y pulsa Enter" style="flex:1">' +
    '<button type="button" class="secondary" data-action="add-tag">+ Añadir</button>' +
  '</div>' +
  '<p class="help">Etiquetas descriptivas para clasificación y búsqueda rápida.</p>';
}

function fileEditor() {
  return '<label for="files">Evidencias <span class="opt">Opcionales</span></label>' +
    '<input id="files" type="file" accept="image/jpeg,image/png,application/pdf" multiple aria-describedby="file-help ' + (errors.files ? 'err-files' : '') + '" ' + (errors.files ? 'aria-invalid="true"' : '') + '>' +
    '<p class="help" id="file-help">JPG, PNG o PDF · Hasta 5 MB por archivo. Se subirán al almacenamiento privado en Supabase.</p>' +
    (errors.files ? '<p class="field-error" id="err-files">' + esc(errors.files) + '</p><button type="button" class="link" data-action="clear-file-error">Descartar selección</button>' : '') +
    files.map((f, i) =>

          field('prioridad', 'Prioridad', draft.prioridad, { options: [['baja', 'Baja'], ['media', 'Media'], ['alta', 'Alta'], ['urgente', 'Urgente']] }) +
          field('titulo', 'Título', draft.titulo, { full: true, placeholder: 'Resume brevemente qué sucede (ej. Aire acondicionado no enfría)' }) +
          field('descripcion', 'Descripción detallada', draft.descripcion, { full: true, textarea: true, placeholder: 'Explica qué ocurre, desde cuándo y qué impacto tiene en las actividades...' }) +
          field('edificio', 'Edificio', draft.edificio, { placeholder: 'Ej. Edificio B' }) +
          field('area', 'Área o espacio específico', draft.area, { placeholder: 'Ej. Laboratorio 3, Aula 4, Pasillo norte' }) +
        '</div>' +
      '</section>' +
      (specs.length
        ? '<section class="section"><h2><span class="step">02</span>Datos técnicos de ' + esc(CATS[draft.categoria].toLowerCase()) + '</h2><div class="formgrid">' +
          specs.map(([k, l, req, options]) => field(k, l, draft.detalle[k] || '', {
            optional: !req,
            options,
            type: k === 'estudiantes_afectados' ? 'number' : 'text',
            placeholder: k === 'insumos_requeridos' ? 'Indica qué refacciones o insumos se necesitan' : 'Escribe el valor'
          })).join('') +
          '</div></section>'
        : '<div class="categoryhint small muted">Selecciona una categoría arriba para mostrar los atributos específicos del reporte.</div>') +
      '<section class="section">' +
        '<h2><span class="step">' + (specs.length ? '03' : '02') + '</span>Etiquetas y evidencias</h2>' +
        tagEditor(draft.tags) +
        '<div style="margin-top:22px">' + fileEditor() + '</div>' +
      '</section>' +
      '<footer class="formfooter">' +
        '<span class="help">Se generará un folio único automático y el estado inicial Abierta.</span>' +
        '<div class="row">' +
          btn('Cancelar', 'list', 'ghost') +
          '<button type="submit" ' + (busy ? 'disabled' : '') + '>' + (busy ? 'Guardando en MongoDB Atlas…' : 'Crear incidencia →') + '</button>' +
        '</div>' +
      '</footer>' +
    '</form>' +
    '<aside class="guidance">' +
      '<section class="card">' +
        '<div class="eyebrow">Guía de captura</div>' +
        '<h2 style="margin:12px 0">Reportes claros, soluciones rápidas</h2>' +
        '<ul>' +
          '<li>Describe el síntoma exacto y la ubicación precisa.</li>' +
          '<li>Adjunta fotos o diagnósticos en PDF si facilitan la atención.</li>' +

        '</ul>' +
      '</section>' +

  shell('Crear nueva incidencia', 'Registra los datos para que el área correspondiente pueda atender el caso.', content);

function validateCreate(d) {
  const e = {};
  if (!String(d.categoria || '').trim()) e.categoria = 'Selecciona la categoría.';
  if (!String(d.prioridad || '').trim()) e.prioridad = 'Selecciona la prioridad.';
  if (!String(d.titulo || '').trim()) e.titulo = 'Escribe un título para la incidencia.';
  if (!String(d.descripcion || '').trim()) e.descripcion = 'Describe el problema con suficiente detalle.';
  if (!String(d.edificio || '').trim()) e.edificio = 'Indica el edificio.';
  if (!String(d.area || '').trim()) e.area = 'Indica el área o espacio.';

  for (const [k, l, req, options] of SPEC[d.categoria] || []) {
    const val = String(d.detalle[k] || '').trim();
    if (req && !val) {
      e[k] = 'Completa el campo requerido: ' + l + '.';
    }
  }
  return e;
}

async function detail(id) {
  if (!id) return list();
  selected = id;
  screen = 'detail';
  errors = {};
  busy = true;

  try {
    const [tData, evData] = await Promise.all([
      api('/api/incidencias/' + id),
      api('/api/incidencias/' + id + '/evidencias').catch(() => [])
    ]);
    selectedTicket = tData;
    ticketEvidence = evData || [];
  } catch (err) {
    notice = 'Error al cargar expediente: ' + err.message;
    return list();
  } finally {
    busy = false;
  }

  const t = selectedTicket;
  const area = t.ubicacion ? t.ubicacion.edificio + ' / ' + t.ubicacion.area : 'No especificada';
  const tech = t.tecnicoAsignado ? t.tecnicoAsignado.nombre : 'Sin asignar';

  // Mapeo dinámico del detalle específico polimórfico
  const detEntries = Object.entries(t.detalleEspecifico || {});
  const specsConfig = SPEC[t.categoria] || [];

  const specificHtml = detEntries.length
    ? '<dl class="stack" style="margin-top:16px">' +
      detEntries.map(([k, v]) => {
        const found = specsConfig.find(item => item[0] === k);
        const label = found ? found[1] : k;
        let formatted = v;
        if (typeof v === 'boolean') formatted = v ? 'Sí' : 'No';
        if (Array.isArray(v)) formatted = v.join(', ');
        return '<div class="detail"><dt>' + esc(label) + '</dt><dd>' + esc(formatted || 'No especificado') + '</dd></div>';
      }).join('') +
      '</dl>'
    : '<p class="small muted" style="margin-top:14px">Sin campos específicos registrados.</p>';

  const evidenceHtml = ticketEvidence.length
    ? ticketEvidence.map((ev, i) =>
        '<div class="fileitem">' +
          '<div>' +
            '<strong>' + esc(ev.nombreArchivo) + '</strong>' +
            '<div class="small muted">' + (ev.tamanoBytes / 1024).toFixed(0) + ' KB · Subido por ' + esc(ev.nombreUsuario || 'Usuario') + '</div>' +
          '</div>' +
          (ev.urlTemporal ? '<a href="' + esc(ev.urlTemporal) + '" target="_blank" rel="noopener" class="ghost" style="text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:8px">Abrir evidencia ↗</a>' : '') +
        '</div>'
      ).join('')
    : '<p class="small muted">No hay evidencias adjuntas en el bucket de Supabase.</p>';

  const content = '<div class="split">' +
    '<div class="stack">' +
      '<section class="card">' +
        '<div class="cardtitle"><h2>Resumen de la incidencia</h2>' + badge(t.estado) + '</div>' +
        '<p style="white-space:pre-wrap;color:var(--text);font-size:15px;line-height:1.6">' + esc(t.descripcion) + '</p>' +
        '<dl class="detailgrid" style="margin:24px 0 0">' +
          [['Folio', t.codigo],

  const content = '<section class="card">' +
    '<div class="timeline">' +
      (items.length
        ? items.map(h =>
            '<article class="event">' +
              '<div class="row between">' +

async function beginAssign() {
  const t = selectedTicket;
  if (!canAssign(t)) return denied();
  assignDraft = { tecnicoId: t.tecnicoAsignado?.usuarioId || '' };
  errors = {};
  busy = true;

  try {
    techniciansCache = await api('/api/usuarios/tecnicos');
  } catch (err) {
    techniciansCache = [];
  } finally {
    busy = false;
  }
  assign();
}

function assign() {
  const t = selectedTicket;
  if (!canAssign(t)) return denied();
  screen = 'assign';

  // Filtrar técnicos por especialidad o área si aplica
  let techs = techniciansCache;
  if (is('coordinador') && user.area) {
    const areaNorm = normalize(user.area);
    techs = techniciansCache.filter(tech => {
      const esp = normalize(tech.especialidad || tech.area || '');
      return !esp || esp.includes(areaNorm) || areaNorm.includes(esp);
    });
    if (!techs.length) techs = techniciansCache; // fallback
  }

  const techOptions = techs.map(x => [x.id, x.nombre + (x.especialidad ? ' (' + x.especialidad + ')' : '')]);

  const content = '<div class="split">' +
    '<form class="card" id="assignform" novalidate>' +
      errorBox() +
      '<div class="stack">' +
        field('tecnicoId', 'Técnico responsable', assignDraft.tecnicoId, { options: techOptions, placeholder: 'Selecciona al técnico' }) +
      '</div>' +
      '<footer class="formfooter">' +
        btn('Cancelar', 'back-detail', 'ghost') +
        '<button type="submit" ' + (busy ? 'disabled' : '') + '>' + (busy ? 'Guardando…' : 'Confirmar asignación →') + '</button>' +
      '</footer>' +
    '</form>' +
    '<aside class="card">' +
      '<span class="role">Control de Coordinación</span>' +
      '<h2 style="margin-top:18px">Asignación controlada</h2>' +
      '<p class="small" style="margin-top:14px">Responsable actual: ' + esc(t.tecnicoAsignado?.nombre || 'Sin asignar') + '</p>' +
      '<p class="help">La asignación queda registrada en la bitácora de auditoría y notifica la carga de trabajo del técnico.</p>' +
    '</aside>' +
  '</div>';

  shell('Asignar responsable técnico', t.codigo + ' · ' + t.titulo, content);
}

function beginWork() {
  const t = selectedTicket;
  if (!canWork(t)) return denied();
  workDraft = {
    estadoNuevo: t.estado === 'abierta' ? 'en proceso' : t.estado,

        field('comentario', 'Comentario de la intervención realizada', workDraft.comentario, { textarea: true, full: true, placeholder: 'Describe las pruebas realizadas, piezas cambiadas o la solución aplicada (mínimo 10 caracteres)...' }) +

async function assignments() {
  if (!is('coordinador') && !is('superAdmin')) return denied();
  screen = 'assignments';
  errors = {};
  busy = true;

  try {
    const res = await api('/api/incidencias?pagina=1&tamanoPagina=50');
    tickets = (res.elementos || []).filter(t => t.estado !== 'cerrada');
  } catch (err) {
    tickets = [];
  } finally {
    busy = false;
  }

  const unassigned = tickets.filter(t => !t.tecnicoAsignado);

  const content = '<div class="notice">Hay <strong>' + unassigned.length + '</strong> incidencias pendientes de responsable técnico.</div>' +
    '<div class="stack">' +
      (tickets.length
        ? tickets.map(t =>
            '<article class="card ticket">' +
              '<div class="row between">' +
                '<div>' +
                  '<h3>' + esc(t.titulo) + '</h3>' +
                  '<p class="ticket-meta">' + esc(t.codigo) + ' · Área: ' + esc(t.ubicacion ? t.ubicacion.edificio + ' - ' + t.ubicacion.area : '') + ' · Responsable: ' + esc(t.tecnicoAsignado ? t.tecnicoAsignado.nombre : 'Sin asignar') + '</p>' +
                '</div>' +
                '<button data-action="assign-ticket" data-id="' + esc(t.id) + '">' +
                  (t.tecnicoAsignado ? 'Reasignar' : 'Asignar técnico') +
                '</button>' +
              '</div>' +
            '</article>'
          ).join('')
        : '<p class="muted">No hay tickets activos en este momento.</p>') +
    '</div>';

  shell('Administración y Asignaciones', 'Supervisa y distribuye la atención operativa entre los técnicos.', content);
}

// PANTALLAS: ANALÍTICA
// -------------------------------------------------------------
async function analytics() {
  if (!user || is('reportante')) return denied();
  screen = 'analytics';
  busy = true;

  try {
    analyticsCache = await api('/api/analitica/resumen');
  } catch (err) {
    analyticsCache = null;
    notice = 'Error al cargar analítica: ' + err.message;
  } finally {
    busy = false;
  }

  const data = analyticsCache || {
    totalIncidencias: 0,
    horasInvertidas: 0,
    porEstado: [],
    porCategoria: [],
    porEdificio: [],
    tagsFrecuentes: []
  };

  const maxCat = Math.max(1, ...data.porCategoria.map(x => x.total));
  const maxEst = Math.max(1, ...data.porEstado.map(x => x.total));

  const content = '<div class="metrics">' +
    '<div class="card metric"><div class="eyebrow">Total de incidencias</div><div class="number">' + data.totalIncidencias + '</div><span class="help">En MongoDB Atlas</span></div>' +
    '<div class="card metric"><div class="eyebrow">Horas totales</div><div class="number green">' + (data.horasInvertidas || 0).toFixed(1) + ' h</div><span class="help">Dedicadas por el equipo</span></div>' +
    '<div class="card metric"><div class="eyebrow">Edificios con reportes</div><div class="number">' + data.porEdificio.length + '</div><span class="help">En el campus universitario</span></div>' +
  '</div>' +
  '<div class="split">' +
    '<section class="card">' +
      '<h2>Distribución por categoría</h2>' +
      data.porCategoria.map(c => {
        const pct = Math.round((c.total / maxCat) * 100);
        return '<div class="analyticsrow"><span class="small">' + esc(CATS[c.nombre] || c.nombre) + '</span><div class="progress"><div style="width:' + pct + '%"></div></div><span class="small muted">' + c.total + '</span></div>';
      }).join('') +
      '<div class="divider"></div>' +
      '<h2>Distribución por estado</h2>' +
      data.porEstado.map(e => {
        const pct = Math.round((e.total / maxEst) * 100);
        return '<div class="analyticsrow"><span class="small">' + esc(STATUS[e.nombre] || e.nombre) + '</span><div class="progress"><div style="width:' + pct + '%"></div></div><span class="small muted">' + e.total + '</span></div>';
      }).join('') +
      '<div class="divider"></div>' +
      '<h3>Etiquetas frecuentes</h3>' +
      '<div class="tags" style="margin-top:16px">' +
        data.tagsFrecuentes.map(t => tag(t.nombre + ' (' + t.total + ')')).join('') +
      '</div>' +
    '</section>' +
    '<aside class="card">' +
      '<h2>Por edificio</h2>' +
      data.porEdificio.map(b =>
        '<p class="small" style="margin-top:10px">' + esc(b.nombre) + ' · <strong>' + b.total + '</strong> incidencias</p>'
      ).join('') +
    '</aside>' +
  '</div>';

  shell(
    is('directivo') ? 'Analítica del Campus' : is('tecnico') ? 'Mi actividad operativa' : 'Analítica Operativa',
    'Indicadores consolidados calculados mediante pipelines de agregación en MongoDB.',
    content
  );
}

// PANTALLAS: USUARIOS (SUPERADMIN)
// -------------------------------------------------------------
async function usersScreen() {
  if (!is('superAdmin')) return denied();
  screen = 'users';
  errors = {};
  busy = true;

  try {
    usersCache = await api('/api/usuarios');
  } catch (err) {
    usersCache = [];
    notice = 'Error al cargar usuarios: ' + err.message;
  } finally {
    busy = false;
  }

  const filas = usersCache.length
    ? usersCache.map(u => {
        const detalle = u.rol === 'tecnico'
          ? (u.especialidad || '—')
          : u.rol === 'coordinador'
            ? (u.area || '—')
            : u.rol === 'reportante'
              ? (u.tipoReportante || '—')
              : (u.area || '—');
        const esMiCuenta = u.id === user.id;

        return '<tr>' +
          '<td><strong>' + esc(u.nombre) + '</strong>' + (esMiCuenta ? ' <span class="small muted">(tú)</span>' : '') + '</td>' +
          '<td>' + esc(u.email) + '</td>' +
          '<td>' + esc(ROLES_LABELS[u.rol] || u.rol) + '</td>' +
          '<td>' + esc(detalle) + '</td>' +
          '<td><span class="badge ' + (u.activo ? 'resolved' : 'attention') + '">' + (u.activo ? 'Activo' : 'Inactivo') + '</span></td>' +
          '<td>' +
            '<div class="row">' +
              '<button type="button" class="ghost" data-action="edit-user" data-id="' + esc(u.id) + '">Editar</button>' +
              '<button type="button" class="secondary" data-action="toggle-user-active" data-id="' + esc(u.id) + '" data-activo="' + (!u.activo) + '"' + (esMiCuenta ? ' disabled' : '') + '>' +
                (u.activo ? 'Desactivar' : 'Activar') +
              '</button>' +
              '<button type="button" class="ghost" data-action="delete-user" data-id="' + esc(u.id) + '"' + (esMiCuenta ? ' disabled' : '') + '>Eliminar</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="6" class="muted">No hay usuarios registrados.</td></tr>';

  const content = '<section class="card">' +
    '<div class="cardtitle"><h2>Usuarios registrados</h2><span class="small muted">' + usersCache.length + ' usuarios</span></div>' +
    '<div class="tablewrap">' +
      '<table class="changes">' +
        '<thead>' +
          '<tr><th>NOMBRE</th><th>EMAIL</th><th>ROL</th><th>ÁREA/ESPECIALIDAD</th><th>ESTADO</th><th>ACCIONES</th></tr>' +
        '</thead>' +
        '<tbody>' + filas + '</tbody>' +
      '</table>' +
    '</div>' +
  '</section>';

  shell('Gestión de Usuarios', 'Administración de accesos, roles y cuentas del campus universitario.', content, btn('+ Crear usuario', 'new-user'));
}

function beginUserEdit(id = null) {
  if (!is('superAdmin')) return denied();

  const found = id ? usersCache.find(u => u.id === id) : null;
  if (id && !found) {
    notice = 'No se encontró el usuario seleccionado.';
    return usersScreen();
  }

  managedUserId = found ? found.id : null;
  userFormDraft = {
    nombre: found?.nombre || '',
    email: found?.email || '',
    rol: found?.rol || 'reportante',
    tipoReportante: found?.tipoReportante || '',
    area: found?.area || '',
    especialidad: found?.especialidad || '',
    activo: found ? String(found.activo) : 'true',
    password: ''
  };
  errors = {};
  userForm();
}

  if (!is('superAdmin')) return denied();
  screen = 'edit-user';

  const content = '<form class="card" id="userform" novalidate>' +
    errorBox() +
    '<div class="formgrid">' +
      field('nombre', 'Nombre completo', userFormDraft.nombre) +
      field('email', 'Correo institucional', userFormDraft.email, { type: 'email' }) +

function beginUserDelete(id) {
  if (!is('superAdmin')) return denied();

  const found = usersCache.find(u => u.id === id);
  if (!found) {
    notice = 'No se encontró el usuario seleccionado.';
    return usersScreen();

  if (found.id === user.id) {
    notice = 'No puedes eliminar tu propia cuenta.';
    return usersScreen();

  managedUserId = found.id;
  screen = 'delete-user';

  const content = '<section class="card">' +
    '<h2>¿Eliminar esta cuenta?</h2>' +
    '<p style="margin:15px 0">' + esc(found.nombre) + ' · ' + esc(found.email) + '</p>' +
    '<p class="help">Esta acción elimina el usuario de MongoDB Atlas y no se puede deshacer.</p>' +
    '<form id="deleteuserform" style="margin-top:20px">' +
      '<div class="row">' +
        '<button type="submit" ' + (busy ? 'disabled' : '') + '>Confirmar eliminación</button>' +
        btn('Cancelar', 'users', 'ghost') +
      '</div>' +
    '</form>' +
  '</section>';

  shell('Eliminar usuario', 'Confirmación de borrado definitivo.', content);
}

// -------------------------------------------------------------
// PANTALLAS: EDICIÓN Y BORRADO DE INCIDENCIAS (SUPERADMIN)
// -------------------------------------------------------------
function beginTicketEdit() {
  const t = selectedTicket;
  if (!is('superAdmin') || !t) return denied();

  ticketEditDraft = {
    titulo: t.titulo || '',
    descripcion: t.descripcion || '',
    categoria: t.categoria || '',
    prioridad: t.prioridad || '',
    edificio: t.ubicacion?.edificio || '',
    area: t.ubicacion?.area || ''
  };
  errors = {};
  ticketEdit();
}

function ticketEdit() {
  const t = selectedTicket;
  if (!is('superAdmin') || !t) return denied();
  screen = 'edit-ticket';

  const content = '<form class="card" id="ticketeditform" novalidate>' +
    errorBox() +
    '<div class="formgrid">' +
      field('titulo', 'Título de la incidencia', ticketEditDraft.titulo, { full: true }) +
      field('descripcion', 'Descripción', ticketEditDraft.descripcion, { textarea: true, full: true }) +
      field('categoria', 'Categoría', ticketEditDraft.categoria, { options: Object.entries(CATS) }) +
      field('prioridad', 'Prioridad', ticketEditDraft.prioridad, { options: [['baja', 'Baja'], ['media', 'Media'], ['alta', 'Alta']] }) +
      field('edificio', 'Edificio', ticketEditDraft.edificio) +
      field('area', 'Área o espacio', ticketEditDraft.area) +
    '</div>' +
    '<p class="help">La modificación quedará registrada en el historial de la incidencia.</p>' +
    '<footer class="formfooter">' +
      btn('Cancelar', 'back-detail', 'ghost') +
      '<button type="submit" ' + (busy ? 'disabled' : '') + '>' + (busy ? 'Guardando…' : 'Guardar cambios →') + '</button>' +
    '</footer>' +
  '</form>';

  shell('Editar incidencia', t.codigo + ' · ' + t.titulo, content);
}

function beginDeleteTicket() {
  const t = selectedTicket;
  if (!is('superAdmin') || !t) return denied();
  screen = 'delete-ticket';

  const content = '<section class="card">' +
    '<h2>¿Eliminar esta incidencia?</h2>' +
    '<p style="margin:15px 0">' + esc(t.titulo) + '</p>' +
    '<p class="help">Se eliminará el expediente ' + esc(t.codigo) + ' y su historial. Esta acción no se puede deshacer.</p>' +
    '<form id="deleteticketform" style="margin-top:20px">' +
      '<div class="row">' +
        '<button type="submit" ' + (busy ? 'disabled' : '') + '>Confirmar eliminación</button>' +
        btn('Cancelar', 'back-detail', 'ghost') +
      '</div>' +
    '</form>' +
  '</section>';

  shell('Eliminar incidencia', t.codigo, content);
}

// -------------------------------------------------------------
// PANTALLA: COMPLETADO (RESUMEN DE ACCIÓN)
// -------------------------------------------------------------
function completed() {
  const t = selectedTicket;
  if (!completion || !t) return dashboard();
  screen = 'completed';

  const b = completion.before;
  const a = completion.after;

  const rows = [
    ['Estado', STATUS[b.estado] || b.estado, STATUS[a.estado] || a.estado],
    ['Horas acumuladas', (b.horasInvertidas || 0) + ' h', (a.horasInvertidas || 0) + ' h'],
    ['Responsable', b.tecnicoAsignado?.nombre || 'Sin asignar', a.tecnicoAsignado?.nombre || 'Sin asignar'],
    ['Evidencias', b.evidenciasAdjuntas?.length || 0, a.evidenciasAdjuntas?.length || 0]
  ];

  const content = '<section class="card">' +
    '<div class="success-icon">✓</div>' +
    '<h2>' + esc(completion.title) + '</h2>' +
    '<p class="small" style="margin:10px 0 24px">' + esc(t.titulo) + '</p>' +
    '<div class="tablewrap">' +
      '<table class="changes">' +
        '<thead><tr><th>CAMBIO</th><th>ANTES</th><th>AHORA</th></tr></thead>' +
        '<tbody>' +
          rows.map(row => '<tr>' + row.map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>').join('') +
        '</tbody>' +
      '</table>' +
    '</div>' +
    (completion.comment ? '<div class="notice" style="margin:24px 0"><strong>Comentario registrado en la bitácora</strong><p style="margin-top:7px">' + esc(completion.comment) + '</p></div>' : '') +
    '<div class="row">' +
      btn('Ver expediente actualizado', 'back-detail') +
      btn('Volver a incidencias', 'list', 'secondary') +
    '</div>' +
  '</section>';

  shell('Actualización completada', t.codigo + ' · Registro guardado con éxito.', content);
}

function denied() {
  if (!user) {
    errors = {};
    return login();
  }
  notice = 'Esta operación no está permitida para tu rol actual (' + roleLabel() + ').';
  dashboard();
}

function validFiles(selection) {
  const invalid = selection.find(f => !['image/jpeg', 'image/png', 'application/pdf'].includes(f.type) || f.size > 5 * 1024 * 1024);
  return invalid ? invalid.name + ': formato o tamaño no admitido (solo JPG, PNG o PDF de hasta 5 MB).' : null;
}

// -------------------------------------------------------------
// MANEJADORES DE EVENTOS DEL DOM
// -------------------------------------------------------------
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;

  if (a === 'toggle-password') {
    const input = $('password');
    if (input) {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.textContent = show ? 'Ocultar' : 'Mostrar';
      b.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
      b.setAttribute('aria-pressed', String(show));
      input.focus();
    }
    return;
  }

  if (a === 'home') return user ? dashboard() : home();
  if (a === 'login') return user ? dashboard() : login();
  if (a === 'logout') return logout();

  if (!user) return login();

  notice = '';
  if (a === 'dashboard') return dashboard();
  if (a === 'list') { page = 1; return list(); }
  if (a === 'prev-page') { if (page > 1) { page--; return list(); } }
  if (a === 'next-page') { page++; return list(); }
  if (a === 'create') return beginCreate();
  if (a === 'analytics') return analytics();
  if (a === 'assignments') return assignments();
  if (a === 'users') return usersScreen();
  if (a === 'new-user') return beginUserEdit();
  if (a === 'edit-user') return beginUserEdit(b.dataset.id);
  if (a === 'delete-user') return beginUserDelete(b.dataset.id);
  if (a === 'edit-ticket') return beginTicketEdit();
  if (a === 'delete-ticket') return beginDeleteTicket();
  if (a === 'detail') return detail(b.dataset.id);
  if (a === 'back-detail') return detail(selected);
  if (a === 'history') return history();
  if (a === 'work') return beginWork();
  if (a === 'assign') return beginAssign();
  if (a === 'assign-ticket') { selected = b.dataset.id; await detail(selected); return beginAssign(); }
  if (a === 'close-ticket') return beginClose();
  if (a === 'reopen-ticket') return beginReopen();
  if (a === 'attach') return attach();

  if (a === 'clear-filters') {
    query = '';
    filterTags = [];
    filterEstado = '';
    filterCategoria = '';
    page = 1;
    return list();
  }

  if (a === 'filter-tag') {
    const t = b.dataset.tag;
    filterTags = filterTags.includes(t) ? filterTags.filter(x => x !== t) : [t];
    page = 1;
    return list();
  }

  if (a === 'add-tag') {
    if (screen === 'create' && $('createform')) readCreate($('createform'));
    const input = $('taginput');
    if (input) {
      const clean = cleanTag(input.value);
      if (clean && !draft.tags.includes(clean)) {
        draft.tags.push(clean);
        create();
        $('taginput')?.focus();
      }
    }
    return;
  }

  if (a === 'remove-tag') {
    if (screen === 'create' && $('createform')) readCreate($('createform'));
    const t = b.dataset.tag;
    if (draft && draft.tags) {
      draft.tags = draft.tags.filter(x => x !== t);
      create();
    }
    return;
  }

  if (a === 'remove-file') {
    files.splice(Number(b.dataset.index), 1);
    if (screen === 'create') create();
    else if (screen === 'work') work();
    else if (screen === 'attach') attach();
    return;
  }

  if (a === 'clear-file-error') {
    delete errors.files;
    if (screen === 'create') create();
    else if (screen === 'work') work();
    else if (screen === 'attach') attach();
    return;
  }

  if (a === 'toggle-user-active') {
    const uId = b.dataset.id;
    const nuevoActivo = b.dataset.activo === 'true';
    busy = true;
    try {
      await api('/api/usuarios/' + uId + '/estado', {
        method: 'PATCH',
        body: JSON.stringify({ activo: nuevoActivo })
      });
      notice = 'Estado de usuario actualizado correctamente.';
      await usersScreen();
    } catch (err) {
      notice = 'Error al cambiar el estado: ' + err.message;
      await usersScreen();
    } finally {
      busy = false;
    }
    return;
  }
});

app.addEventListener('keydown', e => {
  if (e.target.id === 'taginput' && e.key === 'Enter') {
    e.preventDefault();
    if (screen === 'create' && $('createform')) readCreate($('createform'));
    const clean = cleanTag(e.target.value);
    if (clean && !draft.tags.includes(clean)) {
      draft.tags.push(clean);
      create();
      $('taginput')?.focus();
    }
  }
});

app.addEventListener('change', e => {
  if (e.target.id === 'categoria') {
    if ($('createform')) readCreate($('createform'));
    draft.detalle = {};
    errors = {};
    return create();
  }
  if (e.target.id === 'files') {
    const selected = [...e.target.files];
    const err = validFiles(selected);
    if (err) {
      errors.files = err;
    } else {
      delete errors.files;
      files.push(...selected);
    }
    if (screen === 'create') create();
    else if (screen === 'work') work();
    else if (screen === 'attach') attach();
  }
});

// -------------------------------------------------------------
// MANEJO DE ENVÍO DE FORMULARIOS (SUBMIT)
// -------------------------------------------------------------
app.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;

  // LOGIN
  if (f.id === 'loginform') {
    if (busy) return;
    const fd = new FormData(f);
    const email = String(fd.get('email') || '').trim();
    const password = String(fd.get('password') || '');
    errors = {};

    if (!email) errors.email = 'Escribe tu correo institucional.';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'Introduce un correo válido.';
    if (!password) errors.password = 'Escribe tu contraseña.';

    if (Object.keys(errors).length) {
      login(email);
      return focusError();
    }

    busy = true;
    login(email);

    try {
      const res = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });

      sessionStorage.setItem('utm_token', res.token);
      localStorage.setItem('utm_token', res.token);
      user = res.usuario;
      notice = '¡Bienvenido, ' + user.nombre + '!';
      dashboard();
    } catch (err) {
      errors.password = err.message || 'Error al validar credenciales.';
      login(email);
      focusError();
    } finally {
      busy = false;
    }
    return;
  }

  // BUSCADOR EN LISTADO
  if (f.id === 'searchform') {
    query = String($('query')?.value || '');
    filterEstado = String($('filterEstado')?.value || '');
    filterCategoria = String($('filterCategoria')?.value || '');
    page = 1;
    return list();
  }

  // CREAR / EDITAR USUARIO (SUPERADMIN)
  if (f.id === 'userform') {
    if (!is('superAdmin')) return denied();

    const fd = new FormData(f);
    userFormDraft = {
      nombre: String(fd.get('nombre') || '').trim(),
      email: String(fd.get('email') || '').trim().toLowerCase(),
      rol: String(fd.get('rol') || ''),
      tipoReportante: String(fd.get('tipoReportante') || ''),
      area: String(fd.get('area') || ''),
      especialidad: String(fd.get('especialidad') || ''),
      activo: String(fd.get('activo') || 'true'),
      password: String(fd.get('password') || '')
    };

    errors = {};
    if (!userFormDraft.nombre) errors.nombre = 'Escribe el nombre completo.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userFormDraft.email)) errors.email = 'Introduce un correo válido.';
    if (!ROLES_LABELS[userFormDraft.rol]) errors.rol = 'Selecciona un rol válido.';
    if (userFormDraft.rol === 'coordinador' && !userFormDraft.area) errors.area = 'Selecciona el área del coordinador.';
    if (userFormDraft.rol === 'tecnico' && !userFormDraft.especialidad) errors.especialidad = 'Escribe la especialidad del técnico.';
    if (userFormDraft.rol === 'reportante' && !userFormDraft.tipoReportante) errors.tipoReportante = 'Selecciona el tipo de reportante.';
    if (!managedUserId && userFormDraft.password.length < 8) errors.password = 'La contraseña debe tener al menos 8 caracteres.';
    if (managedUserId && userFormDraft.password && userFormDraft.password.length < 8) errors.password = 'La nueva contraseña debe tener al menos 8 caracteres.';

    if (Object.keys(errors).length) {
      userForm();
      return focusError();
    }

    const payload = {
      nombre: userFormDraft.nombre,
      email: userFormDraft.email,
      rol: userFormDraft.rol,
      tipoReportante: userFormDraft.rol === 'reportante' ? userFormDraft.tipoReportante : null,
      area: userFormDraft.rol === 'coordinador' ? userFormDraft.area : null,
      especialidad: userFormDraft.rol === 'tecnico' ? userFormDraft.especialidad : null,
      activo: userFormDraft.activo === 'true',
      password: userFormDraft.password || null
    };

    busy = true;
    userForm();

    try {
      if (managedUserId) {
        await api('/api/usuarios/' + managedUserId, {
          method: 'PUT',
          body: JSON.stringify(payload)
        });
        notice = 'Usuario actualizado correctamente.';
      } else {
        await api('/api/usuarios', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        notice = 'Usuario creado correctamente.';
      }

      managedUserId = null;
      userFormDraft = null;
      await usersScreen();
    } catch (err) {
      errors.general = err.message;
      userForm();
      focusError();
    } finally {
      busy = false;
    }
    return;
  }

  // ELIMINAR USUARIO (SUPERADMIN)
  if (f.id === 'deleteuserform') {
    if (!is('superAdmin') || !managedUserId) return denied();

    busy = true;
    try {
      await api('/api/usuarios/' + managedUserId, { method: 'DELETE' });
      managedUserId = null;
      notice = 'Usuario eliminado correctamente.';
      await usersScreen();
    } catch (err) {
      notice = 'Error al eliminar el usuario: ' + err.message;
      await usersScreen();
    } finally {
      busy = false;
    }
    return;
  }

  // EDITAR INCIDENCIA (SUPERADMIN)
  if (f.id === 'ticketeditform') {
    const t = selectedTicket;
    if (!is('superAdmin') || !t) return denied();

    const fd = new FormData(f);
    ticketEditDraft = {
      titulo: String(fd.get('titulo') || '').trim(),
      descripcion: String(fd.get('descripcion') || '').trim(),
      categoria: String(fd.get('categoria') || ''),
      prioridad: String(fd.get('prioridad') || ''),
      edificio: String(fd.get('edificio') || '').trim(),
      area: String(fd.get('area') || '').trim()
    };

    errors = {};
    if (!ticketEditDraft.titulo) errors.titulo = 'Escribe el título de la incidencia.';
    if (!ticketEditDraft.descripcion) errors.descripcion = 'Escribe la descripción.';
    if (!CATS[ticketEditDraft.categoria]) errors.categoria = 'Selecciona la categoría.';
    if (!ticketEditDraft.prioridad) errors.prioridad = 'Selecciona la prioridad.';
    if (!ticketEditDraft.edificio) errors.edificio = 'Indica el edificio.';
    if (!ticketEditDraft.area) errors.area = 'Indica el área o espacio.';

    if (Object.keys(errors).length) {
      ticketEdit();
      return focusError();
    }

    const payload = {
      titulo: ticketEditDraft.titulo,
      descripcion: ticketEditDraft.descripcion,
      categoria: ticketEditDraft.categoria,
      prioridad: ticketEditDraft.prioridad,
      ubicacion: {
        edificio: ticketEditDraft.edificio,
        area: ticketEditDraft.area
      },
      detalleEspecifico: t.detalleEspecifico || {},
      tags: t.tags || []
    };

    busy = true;
    ticketEdit();

    try {
      await api('/api/incidencias/' + t.id, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });
      ticketEditDraft = null;
      notice = 'Datos de la incidencia actualizados correctamente.';
      await detail(t.id);
    } catch (err) {
      errors.general = err.message;
      ticketEdit();
      focusError();
    } finally {
      busy = false;
    }
    return;
  }

  // ELIMINAR INCIDENCIA (SUPERADMIN)
  if (f.id === 'deleteticketform') {
    const t = selectedTicket;
    if (!is('superAdmin') || !t) return denied();

    busy = true;
    try {
      await api('/api/incidencias/' + t.id, { method: 'DELETE' });
      selectedTicket = null;
      ticketEvidence = [];
      notice = 'Incidencia ' + t.codigo + ' eliminada correctamente.';
      await list();
    } catch (err) {
      notice = 'Error al eliminar la incidencia: ' + err.message;
      beginDeleteTicket();
    } finally {
      busy = false;
    }
    return;
  }

  // CREAR INCIDENCIA
  if (f.id === 'createform') {
    if (!canCreate()) return denied();
    readCreate(f);
    errors = validateCreate(draft);

    if (Object.keys(errors).length) {
      create();
      return focusError();
    }

    busy = true;
    create();

    try {
      const payload = {
        titulo: draft.titulo.trim(),
        descripcion: draft.descripcion.trim(),
        categoria: draft.categoria,
        prioridad: draft.prioridad,
        ubicacion: {
          edificio: draft.edificio.trim(),
          area: draft.area.trim()
        },
        detalleEspecifico: draft.detalle,
        tags: draft.tags
      };

      const creada = await api('/api/incidencias', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      // Subir evidencias si seleccionó alguna
      if (files.length > 0) {
        for (const file of files) {
          const formPayload = new FormData();
          formPayload.append('archivo', file);
          formPayload.append('visibilidad', 'publica');
          await apiUpload('/api/incidencias/' + creada.id + '/evidencias', formPayload);
        }
      }

      draft = null;
      files = [];
      notice = 'Incidencia ' + creada.codigo + ' registrada correctamente en MongoDB Atlas.';
      detail(creada.id);
    } catch (err) {
      errors.general = 'Error al registrar: ' + err.message;
      create();
      focusError();
    } finally {
      busy = false;
    }
    return;
  }

  // REGISTRAR SEGUIMIENTO TÉCNICO
  if (f.id === 'workform') {
    const t = selectedTicket;
    if (!canWork(t)) return denied();

    const fd = new FormData(f);
    workDraft.estadoNuevo = String(fd.get('estadoNuevo') || '');
    workDraft.horasTrabajadas = Number(fd.get('horasTrabajadas') || 0);
    workDraft.comentario = String(fd.get('comentario') || '').trim();
    workDraft.visibilidad = String(fd.get('visibilidad') || 'publica');

    errors = {};
    if (!workDraft.estadoNuevo) errors.estadoNuevo = 'Selecciona el nuevo estado.';
    if (!workDraft.comentario || workDraft.comentario.length < 10) errors.comentario = 'El comentario debe tener al menos 10 caracteres.';
    if (isNaN(workDraft.horasTrabajadas) || workDraft.horasTrabajadas < 0) errors.horasTrabajadas = 'Horas inválidas.';

    if (Object.keys(errors).length) {
      work();
      return focusError();
    }

    busy = true;
    work();

    try {
      const before = { ...t };
      const res = await api('/api/incidencias/' + t.id + '/seguimientos', {
        method: 'POST',
        body: JSON.stringify(workDraft)
      });

      // Subir evidencias adicionales si hubo
      if (files.length > 0) {
        for (const file of files) {
          const formPayload = new FormData();
          formPayload.append('archivo', file);
          formPayload.append('visibilidad', workDraft.visibilidad);
          await apiUpload('/api/incidencias/' + t.id + '/evidencias', formPayload);
        }
      }

      selectedTicket = res;
      completion = {
        title: 'El seguimiento técnico se registró correctamente',
        comment: workDraft.comentario,
        before,
        after: res
      };
      files = [];
      workDraft = null;
      completed();
    } catch (err) {
      errors.general = err.message;
      work();
      focusError();
    } finally {
      busy = false;
    }
    return;
  }

  // ASIGNAR TÉCNICO
  if (f.id === 'assignform') {
    const t = selectedTicket;
    if (!canAssign(t)) return denied();

    const fd = new FormData(f);
    const tecnicoId = String(fd.get('tecnicoId') || '').trim();
    errors = {};
    if (!tecnicoId) errors.tecnicoId = 'Selecciona un técnico responsable.';

    if (Object.keys(errors).length) {
      assign();
      return focusError();
    }

    busy = true;
    assign();

    try {
      const before = { ...t };
      const res = await api('/api/incidencias/' + t.id + '/asignacion', {
        method: 'PATCH',
        body: JSON.stringify({ tecnicoId })
      });

      selectedTicket = res;
      completion = {
        title: 'Responsable técnico actualizado con éxito',
        comment: 'Asignado a: ' + (res.tecnicoAsignado?.nombre || 'Técnico'),
        before,
        after: res
      };
      completed();
    } catch (err) {
      errors.general = err.message;
      assign();
      focusError();
    } finally {
      busy = false;
    }
    return;
  }

  // CERRAR INCIDENCIA
  if (f.id === 'closeform') {
    const t = selectedTicket;
    if (!canClose(t)) return denied();

    const fd = new FormData(f);
    const comentario = String(fd.get('comentario') || '').trim();
    errors = {};
    if (!comentario || comentario.length < 10) errors.comentario = 'El comentario debe contener al menos 10 caracteres.';

    if (Object.keys(errors).length) {
      beginClose();
      return focusError();
    }

    busy = true;
    try {
      const res = await api('/api/incidencias/' + t.id + '/cerrar', {
        method: 'PATCH',
        body: JSON.stringify({ comentario })
      });
      selectedTicket = res;
      notice = 'La incidencia ' + res.codigo + ' ha sido cerrada.';
      detail(t.id);
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      busy = false;
    }
    return;
  }

  // REABRIR INCIDENCIA
  if (f.id === 'reopenform') {
    const t = selectedTicket;
    if (!canReopen(t)) return denied();

    const fd = new FormData(f);
    const motivo = String(fd.get('motivo') || '').trim();
    errors = {};
    if (!motivo || motivo.length < 10) errors.motivo = 'El motivo debe tener al menos 10 caracteres.';

    if (Object.keys(errors).length) {
      beginReopen();
      return focusError();
    }

    busy = true;
    try {
      const res = await api('/api/incidencias/' + t.id + '/reabrir', {
        method: 'PATCH',
        body: JSON.stringify({ motivo })
      });
      selectedTicket = res;
      notice = 'La incidencia ' + res.codigo + ' ha sido reabierta.';
      detail(t.id);
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      busy = false;
    }
    return;
  }

  // ADJUNTAR EVIDENCIAS DIRECTAS
  if (f.id === 'attachform') {
    const t = selectedTicket;
    if (!canAttach(t)) return denied();

    if (!files.length) {
      errors.files = 'Selecciona al menos un archivo válido.';
      attach();
      return focusError();
    }

    busy = true;
    attach();

    try {
      const fd = new FormData(f);
      const desc = String(fd.get('descripcion') || '').trim();

      for (const file of files) {
        const formPayload = new FormData();
        formPayload.append('archivo', file);
        if (desc) formPayload.append('descripcion', desc);
        formPayload.append('visibilidad', 'publica');
        await apiUpload('/api/incidencias/' + t.id + '/evidencias', formPayload);
      }

      files = [];
      notice = 'Evidencias subidas exitosamente a Supabase Storage.';
      detail(t.id);
    } catch (err) {
      errors.general = err.message;
      attach();
      focusError();
    } finally {
      busy = false;
    }
  }
});

// -------------------------------------------------------------
// INICIALIZACIÓN DE LA SESIÓN
// -------------------------------------------------------------
async function initSession() {
  const token = sessionStorage.getItem('utm_token') || localStorage.getItem('utm_token');
  if (token) {
    try {
      user = await api('/api/auth/me');
      dashboard();
      return;
    } catch {
      sessionStorage.removeItem('utm_token');
      localStorage.removeItem('utm_token');
      user = null;
    }
  }
  home();
}

// Arrancar aplicación
initSession();
