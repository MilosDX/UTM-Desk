</style></head><body><div id="app"></div><script>

const USERS=[

{id:'u-report',email:'reportante@utmdesk.example',name:'María López',role:'reportante',label:'Reportante',type:'estudiante',area:null},
{id:'u-tech',email:'tecnico@utmdesk.example',name:'Carlos Méndez',role:'tecnico',label:'Técnico',area:'infraestructura'},

const TECHS=[{id:'u-tech',name:'Carlos Méndez',area:'infraestructura'},{id:'u-tech2',name:'Elena Ruiz',area:'infraestructura'},{id:'u-net',name:'Javier Díaz',area:'computo_redes'},{id:'u-aca',name:'Lucía Pérez',area:'academico'}];

const STATUSES=['abierta','en_atencion','resuelta'];const STATUS={abierta:'Abierta',en_atencion:'En atención',resuelta:'Resuelta'};
const BASE=[
{id:'inf-01',code:'INC-20261015-INF-0002',title:'Falla de climatización en aula',description:'El aire acondicionado del aula no enfría.',category:'infraestructura',building:'Edificio B',area:'Aula 4',priority:'media',status:'abierta',reporter:'u-report',assigned:'u-tech',tags:['climatizacion','aula'],hours:0,detail:{tipo_dano:'Climatización',riesgo_seguridad:'bajo',requiere_insumos:'si',insumos_requeridos:'Filtro, refrigerante',requiere_contratista:'no'}},
{id:'inf-02',code:'INC-20261016-INF-0003',title:'Luminaria sin funcionar en pasillo',description:'La luminaria del pasillo permanece apagada durante las actividades.',category:'infraestructura',building:'Edificio B',area:'Pasillo',priority:'media',status:'abierta',reporter:'u-other',assigned:null,tags:['iluminacion','mantenimiento'],hours:0,detail:{tipo_dano:'Iluminación',riesgo_seguridad:'medio',requiere_insumos:'si',insumos_requeridos:'Luminaria',requiere_contratista:'no'}},
{id:'red-01',code:'INC-20261015-RED-0001',title:'Sin conexión en laboratorio',description:'Los equipos del laboratorio no tienen acceso a la red.',category:'computo_redes',building:'Edificio A',area:'Laboratorio 2',priority:'alta',status:'en_atencion',reporter:'u-report',assigned:'u-net',tags:['red','conectividad'],hours:1,detail:{tipo_equipo:'Computadora',tipo_falla:'Conectividad',direccion_ip:'192.168.1.10',vlan:'20'}},
{id:'aca-01',code:'INC-20261015-ACA-0003',title:'Error de acceso a plataforma LMS',description:'El alumnado no puede iniciar sesión en el curso.',category:'academico',building:'Edificio B',area:'Servicios académicos',priority:'alta',status:'abierta',reporter:'u-report',assigned:null,tags:['lms','acceso','plataforma'],hours:0,detail:{plataforma:'LMS',codigo_curso:'BDN-2026',periodo_escolar:'2026-3',estudiantes_afectados:'35',codigo_error:'LOGIN-403'}}];
let tickets=BASE.map(t=>({...structuredClone(t),evidence:[],history:[{action:'Registro',author:'Reportante',comment:'Incidencia registrada.',date:'2026-10-15T15:00:00Z',hours:0,status:t.status}]}));
let user=null,screen='home',selected=null,query='',filterTags=[],draft=null,workDraft=null,assignDraft=null,errors={},files=[],completion=null,notice='',busy=false;
// El quinto perfil es una ampliación explícita del alcance original del PDF.
USERS.forEach(account=>{account.active=account.active!==false;});
let managedUserId=null,userDraft=null,ticketEditDraft=null;
const ROLE_LABELS={reportante:'Reportante',tecnico:'Técnico',coordinador:'Coordinador',directivo:'Directivo',superAdmin:'superAdmin'};
const app=document.getElementById('app');const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const cleanTag=s=>normalize(s).replace(/^#+/,'').trim().replace(/\s+/g,'_').replace(/[^a-z0-9_-]/g,'').slice(0,32);
const brand=()=>'<div class="brand"><i class="mark" aria-hidden="true"></i>UTM<span>desk</span></div>';
const scope=()=>!user?'':({reportante:'Únicamente tus reportes',tecnico:'Incidencias asignadas a ti',coordinador:'Administración · Infraestructura',directivo:'Todo el campus · Solo lectura',superAdmin:'Todo el campus · Control total'}[user.role]);
const is=r=>!!user&&user.role===r;
function canCreate(){return !!user&&['reportante','tecnico','coordinador','superAdmin'].includes(user.role)}
function canRead(t){return !!user&&!!t&&(is('superAdmin')||is('directivo')||is('reportante')&&t.reporter===user.id||is('tecnico')&&t.assigned===user.id||is('coordinador')&&t.category===user.area)}
function canWork(t){return canRead(t)&&(is('superAdmin')||is('tecnico')||is('coordinador'))}
function canAssign(t){return canRead(t)&&(is('superAdmin')||is('coordinador')&&t.category===user.area)}
function canAttach(t){return canRead(t)&&!is('directivo')}
function visible(){return tickets.filter(canRead)}
function current(){return tickets.find(t=>t.id===selected)}
function techName(id){return TECHS.find(t=>t.id===id)?.name||'Sin asignar'}
function filtered(){const words=normalize(query).split(/\s+/).filter(Boolean);return visible().filter(t=>words.every(w=>normalize(t.title+' '+t.description).includes(w))&&filterTags.every(tag=>t.tags.includes(tag)))}
function badge(s){return `<span class="badge ${s==='en_atencion'?'attention':s==='resuelta'?'resolved':''}">${STATUS[s]||esc(s)}</span>`}
function tag(t,click=false,active=false){return click?`<button type="button" class="tag ${active?'active':''}" data-action="filter-tag" data-tag="${esc(t)}">#${esc(t)}</button>`:`<span class="tag">#${esc(t)}</span>`}
function field(id,label,value='',opts={}){const error=errors[id],optional=opts.optional?' <span class="opt">Opcional</span>':' *';let control=opts.options?`<select id="${id}" name="${id}" ${error?'aria-invalid="true" aria-describedby="err-'+id+'"':''}><option value="">Selecciona una opción</option>${opts.options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`:opts.textarea?`<textarea id="${id}" name="${id}" maxlength="5000" placeholder="${esc(opts.placeholder||'Escribe la información')}" ${error?'aria-invalid="true" aria-describedby="err-'+id+'"':''}>${esc(value)}</textarea>`:`<input id="${id}" name="${id}" type="${opts.type||'text'}" ${opts.type==='number'?'min="0" step="'+(opts.step||'1')+'"':''} maxlength="${opts.maxlength||160}" autocomplete="${opts.autocomplete||'off'}" value="${esc(value)}" placeholder="${esc(opts.placeholder||'Escribe la información')}" ${error?'aria-invalid="true" aria-describedby="err-'+id+'"':''}>`;if(error)control=control.replace(/<(input|textarea|select) /,'<$1 class="invalid" ');return `<div class="field ${opts.full?'full':''}"><label for="${id}">${label}${optional}</label>${control}${opts.help?`<p class="help">${esc(opts.help)}</p>`:''}${error?`<p class="field-error" id="err-${id}">${esc(error)}</p>`:''}</div>`}
function errorBox(){const all=Object.values(errors);return all.length?`<div class="errorbox" role="alert" tabindex="-1" id="validation-summary"><strong>Revisa ${all.length===1?'este campo':'estos campos'} antes de continuar</strong><ul>${all.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
function focusError(){const id=Object.keys(errors)[0],el=$(id)||$('validation-summary');el?.focus();el?.scrollIntoView?.({block:'center',behavior:'smooth'})}
function btn(label,action,cls=''){return `<button type="button" class="${cls}" data-action="${action}">${label}</button>`}
function shell(title,subtitle,content,action=''){if(!user)return login();const links=[['dashboard','Resumen'],['list',is('tecnico')?'Mis asignaciones':'Incidencias'],...(canCreate()?[['create','Crear incidencia']]:[]),...((is('coordinador')||is('superAdmin'))?[['assignments',is('superAdmin')?'Asignaciones globales':'Administración del área']]:[]),...(is('superAdmin')?[['users','Usuarios y roles']]:[]),...(!is('reportante')?[['analytics','Analítica']]:[])];app.innerHTML=`<div class="layout"><aside class="sidebar">${brand()}<div><div class="eyebrow" style="margin-bottom:12px">Espacio de trabajo</div><div class="role">${esc(user.label)}</div></div><nav>${links.map(([a,l])=>`<button class="${screen===a?'active':''}" data-action="${a}">${l}</button>`).join('')}</nav><footer><div><div class="userName">${esc(user.name)}</div><div class="small muted">${esc(scope())}</div></div>${btn('Cerrar sesión','logout','ghost')}</footer></aside><main class="main"><div class="topbar"><span class="eyebrow">UTM DESK / ${esc(user.label)}</span><span class="small muted">${esc(scope())}</span>${btn('Salir','logout','ghost mobile-exit')}</div><div class="heading"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${action}</div>${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}${content}</main></div>`}
function home(){screen='home';app.innerHTML=`<section class="public"><header class="publicnav">${brand()}<span class="eyebrow">Campus operations</span>${btn('Acceder →','login')}</header><div class="hero"><div><span class="role">Un campus mejor conectado</span><h1>Cada incidencia.<br>Un paso hacia<br><em>la solución.</em></h1><p>Reporta, organiza y da seguimiento a las incidencias de tu campus. La información correcta, en manos del equipo correcto.</p>${btn('Entrar a UTM Desk →','login')}<p class="help" style="margin-top:20px">Acceso por cuenta · Permisos por rol · Seguimiento trazable</p></div><div class="card flow"><div class="eyebrow">Un flujo claro de principio a fin</div>${[['01','Registra el ticket','Descripción y evidencias, en un solo formulario.'],['02','Asigna al equipo','El coordinador administra la atención del área.'],['03','Da seguimiento','El técnico registra avances y horas de trabajo.'],['04','Consulta resultados','Estado, historial e indicadores según tu perfil.']].map(([n,t,d])=>`<div class="row"><span class="index">${n}</span><div><h3>${t}</h3><p class="small">${d}</p></div></div>`).join('')}</div></div><div class="featuregrid">${[['Cómputo y redes','Equipos, conectividad y telecomunicaciones.'],['Infraestructura','Instalaciones, reparaciones y mantenimiento.'],['Servicios académicos','Plataformas, cursos y acceso a servicios.']].map(([t,d])=>`<article class="card"><h2>${t}</h2><p>${d}</p></article>`).join('')}</div><p class="help" style="margin-top:25px">Prototipo local. Los registros se conservan durante esta sesión. No está conectado a la API de producción.</p></section>`}
function login(email=''){screen='login';app.innerHTML=`<section class="auth-screen">${btn('← Volver al inicio','home','ghost auth-back')}<div class="auth-panel"><div class="auth-brand">${brand()}</div><h1 class="auth-title">¡Hola de<br>nuevo!</h1><p class="auth-description">Inicia sesión para entrar a tu espacio de trabajo.</p><form class="loginform auth-form" id="loginform" novalidate>${errorBox()}${field('email','Correo electrónico',email,{type:'email',autocomplete:'username',placeholder:'Escribe tu correo de prueba'})}<div class="auth-password">${field('password','Contraseña','',{type:'password',autocomplete:'current-password',placeholder:'Escribe tu contraseña'})}<button class="password-toggle" type="button" data-action="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button></div><button type="submit" class="auth-submit" ${busy?'disabled':''}>${busy?'Validando acceso…':'Continuar'}</button></form><p class="auth-note">El acceso se asigna según tu correo y contraseña.<br>Simulación local con cuatro cuentas de prueba.</p></div></section>`}
async function authenticate(email,password){const account=USERS.find(u=>u.email===String(email).trim().toLowerCase());const expected=account?.demoPassword||(account?.role==='superAdmin'?'lizandro_2026':account?.role);return account&&account.active!==false&&password===expected?account:null}

function metricCards(data){return `<div class="metrics">${[['abierta','Pendientes'],['en_atencion','En atención'],['resuelta','Resueltas']].map(([s,t],i)=>`<div class="card metric"><div class="eyebrow">${t}</div><div class="number ${i===2?'green':''}">${data.filter(t=>t.status===s).length}</div><span class="help">Dentro de tu alcance</span></div>`).join('')}</div>`}
function ticketCard(t){return `<article class="card ticket"><div class="row between"><div><h3>${esc(t.title)}</h3><div class="ticket-meta">${esc(t.code)} · ${esc(CATS[t.category])} · ${esc(t.building+' / '+t.area)}</div></div><div class="row">${badge(t.status)}<button class="ghost" data-action="detail" data-id="${esc(t.id)}">Ver expediente →</button></div></div><div class="tags" style="margin-top:12px">${t.tags.map(t=>tag(t)).join('')}</div></article>`}
function dashboard(){screen='dashboard';errors={};const data=visible();const title={reportante:'Tus reportes, bajo control',tecnico:'Tu jornada de atención',coordinador:'Control del área',directivo:'Visión del campus',superAdmin:'Control total del campus'}[user.role];const subtitle={reportante:'Registra un problema y acompaña su solución.',tecnico:'Consulta tu carga de trabajo y registra avances en tus asignaciones.',coordinador:'Distribuye la atención de infraestructura y supervisa el seguimiento.',directivo:'Consulta incidencias e indicadores sin modificar la operación.',superAdmin:'Administra usuarios, roles, incidencias y asignaciones de todas las áreas.'}[user.role];let extra=(is('coordinador')||is('superAdmin'))?`<div class="notice"><div class="row between"><span>${data.filter(t=>!t.assigned).length} incidencias sin responsable en tu área.</span>${btn('Administrar asignaciones','assignments','secondary')}</div></div>`:'';shell(title,subtitle,metricCards(data)+extra+`<section class="card"><div class="cardtitle"><h2>Actividad reciente</h2>${btn('Ver todas','list','ghost')}</div><div class="stack">${data.slice(0,3).map(ticketCard).join('')||'<p>No tienes incidencias en este momento.</p>'}</div></section>`,canCreate()?btn('+ Crear incidencia','create'):'')}
function list(){screen='list';const data=filtered(),tags=[...new Set(visible().flatMap(t=>t.tags))];shell(is('tecnico')?'Mis asignaciones':'Incidencias','Busca por palabras del título o descripción y combina etiquetas exactas.',`<section class="card" style="margin-bottom:22px"><form id="searchform" class="filters"><input id="query" name="query" aria-label="Buscar incidencias" type="search" placeholder="Buscar por palabras…" value="${esc(query)}"><button>Buscar</button>${btn('Limpiar','clear-filters','ghost')}</form><div class="tags">${tags.map(t=>tag(t,true,filterTags.includes(t))).join('')}</div><p class="help">Se muestran coincidencias con todas las palabras y etiquetas seleccionadas.</p></section><p class="small muted" style="margin-bottom:14px">${data.length} resultados · ${esc(scope())}</p><div class="stack">${data.length?data.map(ticketCard).join(''):'<div class="card empty"><h2>No hay coincidencias</h2><p>Prueba otra palabra o elimina una etiqueta.</p></div>'}</div>`,canCreate()?btn('+ Crear incidencia','create'):'')}
function newDraft(){return {category:'',title:'',description:'',building:'',area:'',priority:'',tags:[],detail:{}}}
function beginCreate(){if(!canCreate())return;draft=newDraft();files=[];errors={};notice='';create()}
const SPEC={computo_redes:[['tipo_equipo','Tipo de equipo',true],['tipo_falla','Tipo de falla',true],['direccion_ip','Dirección IP',false],['vlan','VLAN',false]],infraestructura:[['tipo_dano','Tipo de daño',true],['riesgo_seguridad','Riesgo de seguridad',true,['bajo','medio','alto']],['requiere_insumos','¿Requiere insumos?',true,[['si','Sí'],['no','No']]],['insumos_requeridos','Insumos requeridos',false],['requiere_contratista','¿Requiere contratista?',true,[['si','Sí'],['no','No']]]],academico:[['plataforma','Plataforma',true],['codigo_curso','Código del curso',true],['periodo_escolar','Periodo escolar',true],['estudiantes_afectados','Estudiantes afectados',true],['codigo_error','Código de error',false]]};
function readCreate(form){const d=new FormData(form);for(const k of ['category','title','description','building','area','priority'])draft[k]=String(d.get(k)||'');for(const [key]of SPEC[draft.category]||[])draft.detail[key]=String(d.get(key)||'')}
function tagEditor(tags){return `<div class="tags">${tags.map(t=>`<span class="tag">#${esc(t)}<button type="button" aria-label="Quitar ${esc(t)}" data-action="remove-tag" data-tag="${esc(t)}">×</button></span>`).join('')}</div><div class="row" style="margin-top:12px"><input id="taginput" aria-label="Nueva etiqueta" placeholder="Escribe una etiqueta y pulsa Enter" style="flex:1"><button type="button" class="secondary" data-action="add-tag">+ Añadir</button></div><p class="help">Cada tag se guarda de forma independiente. Sin duplicados y en minúsculas.</p>`}
function fileEditor(){return `<label for="files">Evidencias <span class="opt">Opcionales</span></label><input id="files" type="file" accept="image/jpeg,image/png,application/pdf" multiple aria-describedby="file-help ${errors.files?'err-files':''}" ${errors.files?'aria-invalid="true"':''}><p class="help" id="file-help">JPG, PNG o PDF · Hasta 5 MB por archivo. Se adjuntan al guardar este mismo formulario.</p>${errors.files?`<p class="field-error" id="err-files">${esc(errors.files)}</p><button type="button" class="link" data-action="clear-file-error">Descartar selección rechazada</button>`:''}${files.map((f,i)=>`<div class="fileitem"><span>${esc(f.name)} · ${(f.size/1024).toFixed(0)} KB</span><button type="button" class="ghost" data-action="remove-file" data-index="${i}">Quitar</button></div>`).join('')}`}
function create(){if(!canCreate())return dashboard();screen='create';if(!draft)draft=newDraft();const catOptions=Object.entries(CATS).filter(([k])=>!is('coordinador')||k===user.area);const specs=SPEC[draft.category]||[];shell('Crear incidencia','Describe el problema y agrega las evidencias en un solo lugar. Los campos con * son obligatorios.',`<div class="split"><form id="createform" class="card" novalidate>${errorBox()}<section class="section"><h2><span class="step">01</span>Información del reporte</h2><div class="formgrid">${field('category','Categoría',draft.category,{options:catOptions})}${field('priority','Prioridad',draft.priority,{options:[['baja','Baja'],['media','Media'],['alta','Alta']]})}${field('title','Título',draft.title,{full:true,placeholder:'Resume qué sucede'})}${field('description','Descripción',draft.description,{full:true,textarea:true,placeholder:'Explica qué ocurre, desde cuándo y a quién afecta'})}${field('building','Edificio',draft.building,{placeholder:'Ej. Edificio B'})}${field('area','Área o espacio',draft.area,{placeholder:'Ej. Aula 4'})}</div></section>${specs.length?`<section class="section"><h2><span class="step">02</span>Datos de ${esc(CATS[draft.category].toLowerCase())}</h2><div class="formgrid">${specs.map(([k,l,req,options])=>field(k,l,draft.detail[k]||'',{optional:!req,options,type:k==='estudiantes_afectados'?'number':'text',placeholder:k==='insumos_requeridos'?'Indica los insumos necesarios':'Escribe la información'})).join('')}</div></section>`:'<div class="categoryhint small muted">Selecciona una categoría para mostrar únicamente los datos que corresponden a tu reporte.</div>'}<section class="section"><h2><span class="step">${specs.length?'03':'02'}</span>Etiquetas y evidencias</h2>${tagEditor(draft.tags)}<div style="margin-top:22px">${fileEditor()}</div></section><footer class="formfooter"><span class="help">Se generarán el folio y el estado inicial al guardar.</span><div class="row">${btn('Cancelar','list','ghost')}<button type="submit">Crear incidencia →</button></div></footer></form><aside class="guidance"><section class="card"><div class="eyebrow">Un buen reporte</div><h2 style="margin:12px 0">Información clara. Atención más rápida.</h2><ul><li>Usa un título breve y específico.</li><li>Indica la ubicación exacta.</li><li>Explica el impacto del problema.</li><li>Adjunta evidencia si ayuda al diagnóstico.</li></ul></section><section class="card"><h3>Ejemplos de títulos</h3><ul>${(draft.category==='academico'?['No puedo acceder al curso','La plataforma muestra un error']:draft.category==='infraestructura'?['El aire acondicionado no enfría','Una luminaria no enciende']:['Los equipos no tienen conexión','La computadora no enciende']).map(s=>`<li>${s}</li>`).join('')}</ul><p class="help">Son sugerencias. El formulario permanece vacío hasta que escribas tu información.</p></section></aside></div>`)}
function validateCreate(d){const e={};for(const [k,l]of [['category','Selecciona la categoría.'],['priority','Selecciona la prioridad.'],['title','Escribe un título para la incidencia.'],['description','Describe el problema.'],['building','Indica el edificio.'],['area','Indica el área o espacio.']])if(!String(d[k]||'').trim())e[k]=l;if(d.category&&!CATS[d.category])e.category='Selecciona una categoría válida.';if(is('coordinador')&&d.category&&d.category!==user.area)e.category='Solo puedes registrar incidencias de tu área.';if(d.priority&&!['baja','media','alta'].includes(d.priority))e.priority='Selecciona una prioridad válida.';for(const [k,l,req,options]of SPEC[d.category]||[]){const v=String(d.detail[k]||'').trim();if(req&&!v)e[k]='Completa: '+l+'.';else if(options&&v&&!options.some(o=>(Array.isArray(o)?o[0]:o)===v))e[k]='Selecciona una opción válida para '+l.toLowerCase()+'.';}if(d.category==='infraestructura'&&d.detail.requiere_insumos==='si'&&!String(d.detail.insumos_requeridos||'').trim())e.insumos_requeridos='Indica cuáles insumos se requieren.';if(d.category==='academico'&&d.detail.estudiantes_afectados!==''&&(!Number.isInteger(Number(d.detail.estudiantes_afectados))||Number(d.detail.estudiantes_afectados)<0))e.estudiantes_afectados='Introduce una cantidad entera mayor o igual a cero.';return e}
function detail(id){const t=tickets.find(t=>t.id===id);if(!canRead(t))return denied();selected=id;screen='detail';errors={};shell(t.title,t.code+' · '+CATS[t.category],`<div class="split"><div class="stack"><section class="card"><div class="cardtitle"><h2>Resumen de la incidencia</h2>${badge(t.status)}</div><p style="white-space:pre-wrap;color:var(--text)">${esc(t.description)}</p><dl class="detailgrid" style="margin:24px 0 0">${[['Ubicación',t.building+' / '+t.area],['Prioridad',t.priority],['Responsable',techName(t.assigned)],['Horas invertidas',t.hours+' h']].map(([a,b])=>`<div class="detail"><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl><div class="tags" style="margin-top:20px">${t.tags.map(x=>tag(x)).join('')}</div></section><section class="card"><div class="cardtitle"><h2>Evidencias</h2><span class="small muted">${t.evidence.length} archivos</span></div>${t.evidence.length?t.evidence.map((f,i)=>`<div class="fileitem"><span>${esc(f.name)}</span><button class="ghost" data-action="file-open" data-index="${i}">Descargar</button></div>`).join(''):'<p class="small">No se han adjuntado archivos.</p>'}</section></div><aside class="stack"><section class="card"><h2>Acciones disponibles</h2><div class="stack" style="margin-top:20px">${canWork(t)?btn('Registrar seguimiento','work'):''}${is('superAdmin')?btn('Editar incidencia','edit-ticket','secondary')+btn('Eliminar incidencia','delete-ticket','ghost'):''}${canAssign(t)?btn('Asignar o corregir técnico','assign','secondary'):''}${canAttach(t)?btn('Adjuntar evidencia','attach','ghost'):''}${btn('Ver historial','history','ghost')}${btn('Volver a incidencias','list','ghost')}</div>${is('directivo')?'<p class="help">Solo lectura. Tu cuenta no puede modificar el ticket.</p>':''}</section><section class="card"><h3>Datos específicos</h3><dl class="stack" style="margin-top:16px">${Object.entries(t.detail).map(([k,v])=>`<div class="detail"><dt>${esc(SPEC[t.category]?.find(x=>x[0]===k)?.[1]||k)}</dt><dd>${esc(v||'No especificado')}</dd></div>`).join('')}</dl></section></aside></div>`,canWork(t)?btn('Atender incidencia','work'):'')}
function history(){const t=current();if(!canRead(t))return denied();screen='history';shell('Historial de seguimiento',t.code+' · '+t.title,`<section class="card"><div class="timeline">${[...t.history].reverse().map(h=>`<article class="event"><div class="row between"><h3>${esc(h.action)}</h3><span class="help">${esc(new Date(h.date).toLocaleString('es-MX'))}</span></div><p>${esc(h.comment)}</p><div class="row" style="margin-top:12px">${badge(h.status)}<span class="small muted">${esc(h.author)} · +${h.hours} h</span></div></article>`).join('')}</div></section>`,btn('← Expediente','back-detail','ghost'))}
function beginWork(){const t=current();if(!canWork(t))return denied();workDraft={status:'',hours:'',comment:'',tags:[...t.tags]};files=[];errors={};work()}
function readWork(form){const d=new FormData(form);for(const k of ['status','hours','comment'])workDraft[k]=String(d.get(k)||'')}
function work(){const t=current();if(!canWork(t))return denied();screen='work';shell('Registrar seguimiento',t.code+' · '+t.title,`<div class="split"><form class="card" id="workform" novalidate>${errorBox()}<div class="formgrid">${field('status','Nuevo estado',workDraft.status,{options:STATUSES.map(s=>[s,STATUS[s]])})}${field('hours','Horas de esta intervención',workDraft.hours,{type:'number',step:'0.25',placeholder:'Ej. 1.5',help:'Se suman al total. Escribe 0 si no agregas tiempo.'})}${field('comment','Comentario de seguimiento',workDraft.comment,{textarea:true,full:true,placeholder:'Describe lo que revisaste, realizaste o resolviste'})}</div><section class="section"><h2>Etiquetas del ticket</h2>${tagEditor(workDraft.tags)}</section><section class="section"><h2>Evidencias de la intervención</h2>${fileEditor()}</section><footer class="formfooter">${btn('Cancelar','back-detail','ghost')}<button>Guardar actualización →</button></footer></form><aside class="card"><div class="eyebrow">Contexto actual</div><h2 style="margin-top:12px">La información del ticket</h2><div class="divider"></div><p class="small">Estado: ${esc(STATUS[t.status])}</p><p class="small">Tiempo acumulado: ${t.hours} h</p><p class="small">Responsable: ${esc(techName(t.assigned))}</p><div class="divider"></div><p class="help">Los campos de actualización están vacíos. Al guardar verás una comparación del antes y el después.</p></aside></div>`)}
function assignments(){if(!is('coordinador')&&!is('superAdmin'))return denied();screen='assignments';errors={};const data=visible();shell(is('superAdmin')?'Asignaciones globales':'Administración del área',is('superAdmin')?'Asigna técnicos a incidencias de cualquier categoría, respetando su especialidad.':'Asigna o corrige responsables de infraestructura. Esta pantalla es exclusiva del coordinador.',`<div class="notice">${data.filter(t=>!t.assigned).length} incidencias pendientes de asignación.</div><div class="stack">${data.map(t=>`<article class="card ticket"><div class="row between"><div><h3>${esc(t.title)}</h3><p class="ticket-meta">${esc(t.code)} · Responsable: ${esc(techName(t.assigned))}</p></div><button data-action="assign-ticket" data-id="${t.id}">${t.assigned?'Corregir asignación':'Asignar técnico'}</button></div></article>`).join('')}</div>`)}
function beginAssign(){const t=current();if(!canAssign(t))return denied();assignDraft={technician:'',comment:''};errors={};assign()}
function assign(){const t=current();if(!canAssign(t))return denied();screen='assign';shell('Asignar responsable',t.code+' · '+t.title,`<div class="split"><form class="card" id="assignform" novalidate>${errorBox()}<div class="stack">${field('technician','Técnico del área',assignDraft.technician,{options:TECHS.filter(x=>x.area===t.category&&USERS.find(account=>account.id===x.id)?.active!==false).map(x=>[x.id,x.name])})}${field('comment','Motivo de la asignación',assignDraft.comment,{textarea:true,placeholder:'Indica por qué se asigna o cambia el responsable'})}</div><footer class="formfooter">${btn('Cancelar','assignments','ghost')}<button>Confirmar asignación →</button></footer></form><aside class="card"><span class="role">${is('superAdmin')?'superAdmin':'Coordinador'}</span><h2 style="margin-top:18px">Asignación controlada</h2><p class="small" style="margin-top:14px">Responsable actual: ${esc(techName(t.assigned))}</p><p class="help">Solo aparecen técnicos de la categoría del ticket. La reasignación conserva el historial y las evidencias.</p></aside></div>`)}
function attach(){const t=current();if(!canAttach(t))return denied();screen='attach';shell('Adjuntar evidencia',t.code+' · '+t.title,`<form class="card" id="attachform" novalidate>${errorBox()}${fileEditor()}<footer class="formfooter">${btn('Cancelar','back-detail','ghost')}<button>Guardar evidencia →</button></footer></form>`)}
function analytics(){if(!user||is('reportante'))return denied();screen='analytics';const data=visible();shell((is('directivo')||is('superAdmin'))?'Analítica del campus':is('tecnico')?'Mi actividad operativa':'Analítica del área','Indicadores calculados con las incidencias dentro de tu alcance.',metricCards(data)+`<div class="split"><section class="card"><h2>Distribución por categoría</h2>${Object.entries(CATS).map(([c,l])=>{const n=data.filter(t=>t.category===c).length;return `<div class="analyticsrow"><span class="small">${l}</span><div class="progress"><div style="width:${Math.round(n/Math.max(1,data.length)*100)}%"></div></div><span class="small muted">${n}</span></div>`}).join('')}<div class="divider"></div><h3>Etiquetas frecuentes</h3><div class="tags" style="margin-top:16px">${[...new Set(data.flatMap(t=>t.tags))].map(t=>tag(t)).join('')}</div><h3 style="margin-top:24px">Edificios</h3>${[...new Set(data.map(t=>t.building))].map(b=>`<p class="small" style="margin-top:10px">${esc(b)} · ${data.filter(t=>t.building===b).length} incidencias</p>`).join('')}</section><aside class="card"><div class="eyebrow">Tiempo registrado</div><div class="number" style="font-size:40px;color:var(--green);margin:15px 0">${data.reduce((n,t)=>n+t.hours,0)} h</div><p class="small">${is('tecnico')?'Solo tus asignaciones.':is('coordinador')?'Solo incidencias del área.':'Todas las incidencias del campus.'}</p></aside></div>`)}
function snapshot(t){return {status:t.status,hours:t.hours,assigned:t.assigned,tags:[...t.tags],evidence:t.evidence.length}}
function completed(){const t=current();if(!completion||completion.id!==selected||!canRead(t))return denied();screen='completed';const b=completion.before,a=completion.after;const rows=[['Estado',STATUS[b.status],STATUS[a.status]],['Horas acumuladas',b.hours+' h',a.hours+' h'],['Responsable',techName(b.assigned),techName(a.assigned)],['Etiquetas',b.tags.map(t=>'#'+t).join(', ')||'Sin etiquetas',a.tags.map(t=>'#'+t).join(', ')||'Sin etiquetas'],['Evidencias',b.evidence,a.evidence]];shell('Actualización completada',t.code+' · Los cambios quedaron registrados en el historial.',`<section class="card"><div class="success-icon">✓</div><h2>${esc(completion.title)}</h2><p class="small" style="margin:10px 0 24px">${esc(t.title)}</p><div class="tablewrap"><table class="changes"><thead><tr><th>CAMBIO</th><th>ANTES</th><th>AHORA</th></tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice" style="margin:24px 0"><strong>Comentario registrado</strong><p style="margin-top:7px">${esc(completion.comment)}</p></div>${t.resolvedAt?'<p class="help" style="margin-bottom:18px">Fecha de resolución registrada. El periodo de retención previsto es de 60 días.</p>':''}<div class="row">${btn('Ver expediente actualizado','back-detail')}${btn('Volver a incidencias','list','secondary')}</div></section>`)}
function denied(){if(!user){errors={};return login()}notice='Esta operación no está disponible para tu cuenta.';dashboard()}
function capture(){if(screen==='create'&&$('createform'))readCreate($('createform'));if(screen==='work'&&$('workform'))readWork($('workform'))}
function tagsDraft(){return screen==='create'?draft?.tags:screen==='work'?workDraft?.tags:null}
function rerenderForm(){if(screen==='create')create();else if(screen==='work')work();else if(screen==='attach')attach()}
function addTag(){capture();const target=tagsDraft(),el=$('taginput');if(!target||!el)return;const value=cleanTag(el.value);if(value&&!target.includes(value))target.push(value);rerenderForm();$('taginput')?.focus()}
function validFiles(selection){const invalid=selection.find(f=>!['image/jpeg','image/png','application/pdf'].includes(f.type)||f.size>5*1024*1024);return invalid?invalid.name+': usa JPG, PNG o PDF de hasta 5 MB.':null}
function appendFiles(selection){const err=validFiles(selection);if(err){errors.files=err;return false}delete errors.files;files.push(...selection);return true}
function createTicket(d){if(!canCreate())return null;const e=validateCreate(d);if(Object.keys(e).length)return null;const stamp=new Date().toISOString().slice(0,10).replace(/-/g,'');const t={...structuredClone(d),title:d.title.trim(),description:d.description.trim(),building:d.building.trim(),area:d.area.trim(),id:crypto.randomUUID(),code:'INC-'+stamp+'-'+({computo_redes:'RED',infraestructura:'INF',academico:'ACA'}[d.category])+'-'+String(tickets.length+1).padStart(4,'0'),status:'abierta',reporter:user.id,assigned:null,hours:0,evidence:[...files],history:[{action:'Registro',author:user.name,comment:'Incidencia registrada con sus evidencias.',hours:0,date:new Date().toISOString(),status:'abierta'}]};tickets.unshift(t);return t}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='toggle-password'){const input=$('password');if(input){const show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Ocultar':'Mostrar';b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.setAttribute('aria-pressed',String(show));input.focus()}return}if(a==='home'){if(user)return dashboard();errors={};return home()}if(a==='login'){if(user)return dashboard();errors={};return login()}if(a==='logout'){user=null;selected=null;draft=null;workDraft=null;assignDraft=null;files=[];completion=null;errors={};notice='';query='';filterTags=[];return login()}if(!user)return login();
notice='';if(a==='dashboard')return dashboard();if(a==='list')return list();if(a==='create')return beginCreate();if(a==='analytics')return analytics();if(a==='assignments')return assignments();if(a==='detail')return detail(b.dataset.id);if(a==='back-detail')return detail(selected);if(a==='history')return history();if(a==='work')return beginWork();if(a==='assign')return beginAssign();if(a==='assign-ticket'){selected=b.dataset.id;return beginAssign()}if(a==='attach'){if(!canAttach(current()))return denied();files=[];errors={};return attach()}if(a==='clear-filters'){query='';filterTags=[];return list()}if(a==='filter-tag'){const t=b.dataset.tag;if(!visible().some(x=>x.tags.includes(t)))return;query=$('query')?.value??query;filterTags=filterTags.includes(t)?filterTags.filter(x=>x!==t):[...filterTags,t];return list()}if(a==='add-tag')return addTag();if(a==='remove-tag'){capture();const tags=tagsDraft();if(tags){const index=tags.indexOf(b.dataset.tag);if(index>=0)tags.splice(index,1);rerenderForm()}return}if(a==='remove-file'){capture();files.splice(Number(b.dataset.index),1);return rerenderForm()}if(a==='clear-file-error'){capture();delete errors.files;return rerenderForm()}if(a==='file-open'){const t=current();if(!canRead(t))return denied();const file=t.evidence[Number(b.dataset.index)];if(!file)return;const url=URL.createObjectURL(file),link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
app.addEventListener('keydown',e=>{if(e.target.id==='taginput'&&e.key==='Enter'){e.preventDefault();addTag()}});
app.addEventListener('change',e=>{if(e.target.id==='category'){capture();draft.detail={};errors={};return create()}if(e.target.id==='files'){capture();appendFiles([...e.target.files]);rerenderForm()}});
app.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='loginform'){if(busy)return;const fd=new FormData(f),email=String(fd.get('email')||''),password=String(fd.get('password')||'');errors={};if(!email.trim())errors.email='Escribe tu correo.';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))errors.email='Introduce un correo válido.';if(!password)errors.password='Escribe tu contraseña.';if(Object.keys(errors).length){login(email);return focusError()}busy=true;try{const u=await authenticate(email,password);if(!u){errors.password='El correo o la contraseña no coinciden.';login(email);focusError()}else{user=u;errors={};query='';filterTags=[];notice='';dashboard()}}catch(err){errors.password='No se pudo validar el acceso en este navegador.';login(email);focusError()}finally{busy=false;if(!user){login(email);focusError()}}return}
if(!user)return login();if(f.id==='searchform'){query=String(new FormData(f).get('query')||'');return list()}
if(f.id==='createform'){if(!canCreate())return denied();readCreate(f);const fileError=errors.files;errors=validateCreate(draft);if(fileError)errors.files=fileError;const pending=cleanTag($('taginput')?.value||'');if(pending&&!draft.tags.includes(pending))draft.tags.push(pending);if(Object.keys(errors).length){create();return focusError()}const t=createTicket(draft);if(!t)return denied();draft=null;files=[];query='';filterTags=[];notice='Incidencia '+t.code+' creada con sus evidencias. '+(is('tecnico')?'Aparecerá en tus asignaciones cuando el coordinador te la asigne.':'Puedes consultar el seguimiento en tu alcance autorizado.');return list()}
if(f.id==='workform'){const t=current();if(!canWork(t))return denied();readWork(f);const fileError=errors.files;errors={};if(!STATUSES.includes(workDraft.status))errors.status='Selecciona el nuevo estado.';if(!String(workDraft.hours).trim())errors.hours='Indica las horas de esta intervención.';else if(!Number.isFinite(Number(workDraft.hours))||Number(workDraft.hours)<0)errors.hours='Las horas deben ser un número mayor o igual a cero.';if(!workDraft.comment.trim())errors.comment='Describe la intervención realizada.';if(fileError)errors.files=fileError;if(Object.keys(errors).length){work();return focusError()}const before=snapshot(t),h=Number(workDraft.hours);t.status=workDraft.status;t.hours+=h;t.tags=[...workDraft.tags];t.evidence.push(...files);if(t.status==='resuelta')t.resolvedAt=t.resolvedAt||new Date().toISOString();else delete t.resolvedAt;t.history.push({action:'Seguimiento',author:user.name,comment:workDraft.comment,hours:h,date:new Date().toISOString(),status:t.status});completion={id:t.id,before,after:snapshot(t),title:'El seguimiento se guardó correctamente',comment:workDraft.comment};files=[];workDraft=null;return completed()}
if(f.id==='assignform'){const t=current();if(!canAssign(t))return denied();const d=new FormData(f);assignDraft={technician:String(d.get('technician')||''),comment:String(d.get('comment')||'')};errors={};const tech=TECHS.find(x=>x.id===assignDraft.technician&&x.area===t.category&&USERS.find(account=>account.id===x.id)?.active!==false);if(!tech)errors.technician='Selecciona un técnico de tu área.';if(!assignDraft.comment.trim())errors.comment='Explica el motivo de la asignación.';if(Object.keys(errors).length){assign();return focusError()}const before=snapshot(t);t.assigned=tech.id;t.history.push({action:'Asignación',author:user.name,comment:assignDraft.comment,hours:0,date:new Date().toISOString(),status:t.status});completion={id:t.id,before,after:snapshot(t),title:'El responsable del ticket se actualizó',comment:assignDraft.comment};assignDraft=null;return completed()}
if(f.id==='attachform'){const t=current();if(!canAttach(t))return denied();if(errors.files||!files.length){if(!files.length)errors.files='Selecciona al menos un archivo válido.';attach();return focusError()}const before=snapshot(t),n=files.length;t.evidence.push(...files);const comment='Se adjuntaron '+n+' evidencias al expediente.';t.history.push({action:'Evidencias',author:user.name,comment,hours:0,date:new Date().toISOString(),status:t.status});completion={id:t.id,before,after:snapshot(t),title:'Evidencias agregadas correctamente',comment};files=[];completed()}});
// Pantallas y operaciones de administración: el control se comprueba también en cada acción.
function manageUsers(){if(!is('superAdmin'))return denied();screen='users';shell('Usuarios y roles','Administración exclusiva de superAdmin. Las contraseñas no se muestran en la lista.',`<div class="stack">${USERS.map(account=>`<article class="card ticket"><div class="row between"><div><h3>${esc(account.name)}</h3><p class="ticket-meta">${esc(account.email)} · ${esc(ROLE_LABELS[account.role])} · ${account.active?'Activo':'Inactivo'}</p></div><div class="row"><button class="ghost" data-action="edit-user" data-id="${esc(account.id)}">Editar usuario</button>${account.id!==user.id?`<button class="secondary" data-action="toggle-user" data-id="${esc(account.id)}">${account.active?'Desactivar':'Activar'}</button>`:''}</div></div></article>`).join('')}</div>`,btn('+ Crear usuario','new-user'))}
function beginUserEdit(id=null){if(!is('superAdmin'))return denied();const found=USERS.find(account=>account.id===id);managedUserId=found?.id||null;userDraft={name:found?.name||'',email:found?.email||'',role:found?.role||'',area:found?.area||'',password:''};errors={};editUser()}
function editUser(){if(!is('superAdmin'))return denied();screen='edit-user';shell(managedUserId?'Editar usuario':'Crear usuario','Define la cuenta y su rol. Una contraseña vacía al editar conserva la contraseña actual.',`<form id="userform" class="card" novalidate>${errorBox()}<div class="formgrid">${field('name','Nombre',userDraft.name)}${field('email','Correo',userDraft.email,{type:'email'})}${field('role','Rol',userDraft.role,{options:Object.entries(ROLE_LABELS)})}${field('userarea','Área o especialidad',userDraft.area,{optional:true,options:Object.entries(CATS)})}${field('password','Contraseña',userDraft.password,{type:'password',optional:!!managedUserId,full:true,placeholder:'Escribe una contraseña'})}</div><p class="help">El área es obligatoria para técnicos y coordinadores. La cuenta actual de superAdmin mantiene su rol.</p><footer class="formfooter">${btn('Cancelar','users','ghost')}<button>Guardar usuario →</button></footer></form>`)}
function beginTicketEdit(){if(!is('superAdmin')||!current())return denied();const t=current();ticketEditDraft={title:t.title,description:t.description,building:t.building,area:t.area,priority:t.priority};errors={};editTicket()}
function editTicket(){if(!is('superAdmin')||!current())return denied();screen='edit-ticket';shell('Editar incidencia',current().code+' · La modificación quedará registrada en el historial.',`<form id="ticketeditform" class="card" novalidate>${errorBox()}<div class="formgrid">${field('title','Título',ticketEditDraft.title,{full:true})}${field('description','Descripción',ticketEditDraft.description,{full:true,textarea:true})}${field('building','Edificio',ticketEditDraft.building)}${field('area','Área o espacio',ticketEditDraft.area)}${field('priority','Prioridad',ticketEditDraft.priority,{options:[['baja','Baja'],['media','Media'],['alta','Alta']]})}</div><footer class="formfooter">${btn('Cancelar','back-detail','ghost')}<button>Guardar cambios →</button></footer></form>`)}
app.addEventListener('click',event=>{const control=event.target.closest('[data-action]');if(!control)return;const action=control.dataset.action;if(!['users','new-user','edit-user','toggle-user','edit-ticket','delete-ticket'].includes(action))return;if(!is('superAdmin'))return denied();if(action==='users')return manageUsers();if(action==='new-user')return beginUserEdit();if(action==='edit-user')return beginUserEdit(control.dataset.id);if(action==='toggle-user'){const account=USERS.find(item=>item.id===control.dataset.id);if(!account||account.id===user.id)return;account.active=!account.active;return manageUsers()}if(action==='edit-ticket')return beginTicketEdit();if(action==='delete-ticket'){const t=current();if(!t)return;screen='confirm-delete';shell('Eliminar incidencia',t.code,`<section class="card"><h2>¿Eliminar este reporte de la simulación?</h2><p style="margin:15px 0">${esc(t.title)}</p><p class="help">Esta acción afecta solo los datos locales de demostración.</p><form id="deleteticketform" style="margin-top:20px"><button>Confirmar eliminación</button></form>${btn('Cancelar','back-detail','ghost')}</section>`)}});
app.addEventListener('submit',event=>{if(!['userform','ticketeditform','deleteticketform'].includes(event.target.id))return;event.preventDefault();if(!is('superAdmin'))return denied();const form=event.target;if(form.id==='deleteticketform'){const t=current();if(!t)return;const position=tickets.findIndex(item=>item.id===t.id);tickets.splice(position,1);selected=null;notice='Incidencia eliminada de la simulación.';return list()}const data=new FormData(form);errors={};if(form.id==='userform'){userDraft={name:String(data.get('name')||'').trim(),email:String(data.get('email')||'').trim().toLowerCase(),role:String(data.get('role')||''),area:String(data.get('userarea')||''),password:String(data.get('password')||'')};if(!userDraft.name)errors.name='Escribe el nombre.';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userDraft.email))errors.email='Introduce un correo válido.';if(USERS.some(account=>account.email===userDraft.email&&account.id!==managedUserId))errors.email='Este correo ya existe.';if(!ROLE_LABELS[userDraft.role])errors.role='Selecciona un rol válido.';if(managedUserId===user.id&&userDraft.role!=='superAdmin')errors.role='La cuenta activa conserva el rol superAdmin.';if(['tecnico','coordinador'].includes(userDraft.role)&&!CATS[userDraft.area])errors.userarea='Selecciona el área o especialidad.';if(!managedUserId&&!userDraft.password)errors.password='Escribe una contraseña.';if(Object.keys(errors).length){editUser();return focusError()}let account=USERS.find(item=>item.id===managedUserId);if(!account){account={id:crypto.randomUUID(),active:true};USERS.push(account)}if(!account.demoPassword&&account.role)account.demoPassword=account.role==='superAdmin'?'lizandro_2026':account.role;Object.assign(account,{name:userDraft.name,email:userDraft.email,role:userDraft.role,label:ROLE_LABELS[userDraft.role],area:['tecnico','coordinador'].includes(userDraft.role)?userDraft.area:null});if(userDraft.password)account.demoPassword=userDraft.password;const techIndex=TECHS.findIndex(technician=>technician.id===account.id);if(account.role==='tecnico'&&account.active){const technician={id:account.id,name:account.name,area:account.area};if(techIndex>=0)TECHS[techIndex]=technician;else TECHS.push(technician)}else if(techIndex>=0)TECHS.splice(techIndex,1);notice='Usuario guardado en la simulación local.';return manageUsers()}
if(form.id==='ticketeditform'){const t=current();if(!t)return;ticketEditDraft=Object.fromEntries(['title','description','building','area','priority'].map(key=>[key,String(data.get(key)||'').trim()]));for(const key of ['title','description','building','area'])if(!ticketEditDraft[key])errors[key]='Completa este campo.';if(!['baja','media','alta'].includes(ticketEditDraft.priority))errors.priority='Selecciona una prioridad válida.';if(Object.keys(errors).length){editTicket();return focusError()}Object.assign(t,ticketEditDraft);t.history.push({action:'Edición administrativa',author:user.name,comment:'Se actualizaron los datos generales de la incidencia.',hours:0,date:new Date().toISOString(),status:t.status});notice='Datos generales actualizados.';return detail(t.id)}});

home();
