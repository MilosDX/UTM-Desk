# Blueprint de Render para UTM Desk (API ASP.NET Core + frontend de wwwroot).
#
# IMPORTANTE: un Blueprint SIEMPRE crea un servicio nuevo, y la URL de Render
# depende del nombre. Para conservar el link actual (https://utm-desk.onrender.com)
# hay que actualizar el servicio existente a mano (Settings -> Repository/Runtime)
# en lugar de crear otro. Ver README, sección "Despliegue".
#
# Este archivo sirve como referencia de la configuración (Dockerfile, health check
# y variables de entorno) y para recrear el servicio con el MISMO nombre si algún
# día hay que rehacerlo (el servicio anterior debe renombrarse o eliminarse antes).
#
# La aplicación se sirve completa en https://<nombre>.onrender.com:
#   /health          -> comprobación de estado
#   /api/*           -> API
#   /                -> frontend estático de wwwroot

services:
  - type: web
    name: utm-desk
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # --- MongoDB Atlas ---
      - key: MongoDb__ConnectionString
        sync: false
      - key: MongoDb__DatabaseName
        value: utm_desk_cloud
      - key: MongoDb__UsuariosCollectionName
        value: usuarios
      - key: MongoDb__IncidenciasCollectionName
        value: incidencias_campus

      # --- Supabase Storage (bucket privado de evidencias) ---
      - key: Supabase__Url
        sync: false
      - key: Supabase__SecretKey
        sync: false
      - key: Supabase__BucketName
        value: utm-desk-evidencias
      - key: Supabase__SignedUrlExpirationMinutes
        value: 30

      # --- JWT ---
      - key: Jwt__Issuer
        value: UTMDesk.Api
      - key: Jwt__Audience
        value: UTMDesk.Client
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__ExpirationMinutes
        value: 120

      # --- Cuenta inicial (opcional) ---
      - key: SuperAdminSeed__Enabled
        value: "false"
